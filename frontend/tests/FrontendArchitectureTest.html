<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FrontendArchitectureTest - Xestify Frontend</title>
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <h2>FrontendArchitectureTest</h2>
  <pre id="output"></pre>

  <script type="module">
    import {
      initTestRunner,
      log,
      test,
      assertEquals,
      assertTrue,
      finishTestRunner,
      separator,
    } from './js/helpers.js';
    import { RouteController } from '../src/js/controllers/RouteController.js';
    import {
      entityCreatePage,
      entityPage,
      entityRecordPage,
      getPageFromHash,
      hashFromPage,
      userDetailPage,
    } from '../src/js/controllers/RouteMapController.js';
    import { PluginRouteController } from '../src/js/controllers/PluginRouteController.js';
    import { SessionModel } from '../src/js/models/SessionModel.js';

    initTestRunner('output');

    function createStorageMock() {
      const values = new Map();
      return {
        getItem(key) {
          return values.has(key) ? values.get(key) : null;
        },
        setItem(key, value) {
          values.set(key, String(value));
        },
        removeItem(key) {
          values.delete(key);
        },
      };
    }

    separator();
    log('Arquitectura 9.4 MVC: controllers de rutas + modelo de sesion');

    await test('RouteController resuelve la pagina inicial desde hash y ejecuta navigate', async () => {
      const originalHash = window.location.hash;
      const visited = [];
      const router = new RouteController({
        onNavigate: async (page) => {
          visited.push(page);
        },
      });

      window.location.hash = '#/users';
      await router.start('entity:clients');
      router.stop();

      assertEquals(visited[0], 'users', 'El router debe resolver #/users como users');
      window.location.hash = originalHash;
    });

    await test('RouteController actualiza hash en navegacion programatica', async () => {
      const originalHash = window.location.hash;
      const visited = [];
      const router = new RouteController({
        onNavigate: async (page) => {
          visited.push(page);
        },
      });

      await router.start('users');
      await router.navigate('plugins', { updateHash: true });
      router.stop();

      assertTrue(window.location.hash === '#/plugins', 'La navegacion debe sincronizar hash');
      assertEquals(visited[visited.length - 1], 'plugins', 'La ultima pagina debe ser plugins');
      window.location.hash = originalHash;
    });

    await test('PluginRouteController parsea y genera rutas de configuracion', async () => {
      const page = '/plugins/comments/config';
      assertTrue(PluginRouteController.isPluginConfigPage(page), 'Debe detectar pagina de config');
      assertEquals(PluginRouteController.getPluginSlugFromPage(page), 'comments', 'Debe extraer slug');
      assertEquals(PluginRouteController.toPluginConfigPage('comments'), '/plugins/comments/config', 'Debe generar ruta estable');
    });

    await test('RouteMapController resuelve las rutas estaticas principales', async () => {
      assertEquals(getPageFromHash('#/profile', 'plugins'), 'profile', 'Debe resolver perfil');
      assertEquals(getPageFromHash('#/users', 'plugins'), 'users', 'Debe resolver usuarios');
      assertEquals(getPageFromHash('#/users/user-7', 'plugins'), 'users:user-7', 'Debe resolver detalle de usuario');
      assertEquals(getPageFromHash('#/plugins', 'users'), 'plugins', 'Debe resolver plugins');
      assertEquals(getPageFromHash('#/plugins/comments/config', 'users'), '/plugins/comments/config', 'Debe resolver configuracion de plugin');
    });

    await test('RouteMapController resuelve alta y detalle de entidad', async () => {
      assertEquals(getPageFromHash('#/entity/clients', 'plugins'), entityPage('clients'), 'Debe resolver listado de entidad');
      assertEquals(getPageFromHash('#/entity/clients/new', 'plugins'), entityCreatePage('clients'), 'Debe resolver alta de entidad');
      assertEquals(getPageFromHash('#/entity/clients/record-9', 'plugins'), entityRecordPage('clients', 'record-9'), 'Debe resolver detalle de entidad');
    });

    await test('RouteMapController genera hashes estables desde paginas internas', async () => {
      assertEquals(hashFromPage(userDetailPage('user-7')), '#/users/user-7', 'Debe generar detalle de usuario');
      assertEquals(hashFromPage(entityPage('clients')), '#/entity/clients', 'Debe generar listado de entidad');
      assertEquals(hashFromPage(entityCreatePage('clients')), '#/entity/clients/new', 'Debe generar alta de entidad');
      assertEquals(hashFromPage(entityRecordPage('clients', 'record-9')), '#/entity/clients/record-9', 'Debe generar detalle de entidad');
    });

    await test('SessionModel persiste y limpia sesion sin depender de localStorage global', async () => {
      const storage = createStorageMock();

      SessionModel.persistAccessToken('jwt.test.value', storage);
      SessionModel.persistUserSnapshot({
        email: 'admin@xestify.local',
        name: 'Admin',
        avatar: '/img/admin.png',
      }, storage);

      const session = SessionModel.readStoredSession(storage);
      assertEquals(session.token, 'jwt.test.value', 'Token persistido incorrecto');
      assertEquals(session.email, 'admin@xestify.local', 'Email persistido incorrecto');
      assertEquals(session.name, 'Admin', 'Nombre persistido incorrecto');
      assertEquals(session.avatar, '/img/admin.png', 'Avatar persistido incorrecto');

      SessionModel.clearStoredSession(storage);
      const afterClear = SessionModel.readStoredSession(storage);
      assertEquals(afterClear.token, null, 'Token no limpiado');
      assertEquals(afterClear.email, null, 'Email no limpiado');
      assertEquals(afterClear.name, null, 'Nombre no limpiado');
      assertEquals(afterClear.avatar, null, 'Avatar no limpiado');
    });

    finishTestRunner('output');
  </script>
</body>
</html>
