<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ComponentsTest - Xestify Frontend</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <h2>ComponentsTest</h2>
  <pre id="output"></pre>

  <script type="module">
    import { component } from '../../js/views/modules/ComponentFactory.js';
    import { InputComponent } from '../../js/views/components/BaseComponent.js';

    const output = document.getElementById('output');
    let passed = 0;
    let failed = 0;

    function log(line) {
      output.textContent += line + '\n';
    }

    function assertTrue(value, message) {
      if (!value) {
        throw new Error(message);
      }
    }

    function assertEquals(actual, expected, message) {
      if (actual !== expected) {
        throw new Error(`${message}: expected "${String(expected)}", got "${String(actual)}"`);
      }
    }

    function test(name, fn) {
      try {
        fn();
        log(`✅ ${name}`);
        passed += 1;
      } catch (error) {
        log(`❌ ${name}: ${error.message}`);
        failed += 1;
      }
    }

    test('component.create dispatches the central factory and renders a stable button', () => {
      const button = component.create('button', { label: 'Guardar', variant: 'primary' });
      assertTrue(button instanceof HTMLButtonElement, 'button should be an HTMLButtonElement');
      assertEquals(button.textContent.trim(), 'Guardar', 'button label mismatch');
      assertTrue(button.className.includes('rounded-lg'), 'button should include rounded classes');
      assertTrue(button.getAttribute('type') === 'button', 'button should default to a button type');
    });

    test('component.create renders layout primitives through the shared factory', () => {
      const typography = component.create('typography', { text: 'Hola', size: 'sm' });
      const page = component.create('page');
      const header = component.create('pageHeader', { title: 'Usuarios', subtitle: 'Gestión de usuarios' });
      const section = component.create('section', { title: 'Detalle', subtitle: 'Bloque de contenido' });

      assertTrue(typography instanceof HTMLElement, 'typography should be an HTMLElement');
      assertTrue(page instanceof HTMLElement, 'page should be an HTMLElement');
      assertTrue(header.querySelector('[data-role="page-title"]') !== null, 'title node missing');
      assertTrue(section.querySelector('h3') !== null, 'section title missing');
    });

    test('component.getCatalog exposes the public components registered by the factory', () => {
      const catalog = component.getCatalog();
      assertTrue(typeof catalog === 'object', 'catalog should be an object');
      assertTrue(Array.isArray(catalog.general), 'general category missing');
      assertTrue(catalog.general.some((item) => item.name === 'button'), 'button should be listed in general');
      assertTrue(catalog.feedback.some((item) => item.name === 'modal'), 'modal should be listed in feedback');
      assertTrue(!catalog.general.some((item) => item.name === 'div'), 'internal primitives should not be public');
    });

    test('component.create rejects unknown names and renders registered native primitives', () => {
      const table = component.create('tableElement');
      const select = component.create('selectTag');
      let error = null;

      try {
        component.create('unknownComponent');
      } catch (caughtError) {
        error = caughtError;
      }

      assertTrue(table instanceof HTMLTableElement, 'tableElement should render a native table');
      assertTrue(select instanceof HTMLSelectElement, 'selectTag should render a native select');
      assertTrue(error instanceof Error, 'unknown component should throw');
      assertTrue(error.message.includes('not registered'), 'unknown component error should be descriptive');
    });

    test('component.create renders navigation and data-entry primitives', () => {
      const breadcrumb = component.create('breadcrumb', [
        { label: 'Inicio', href: '#/' },
        { label: 'Usuarios', href: '#/users', active: true },
      ]);
      const tabs = component.create('tabs', {
        tabs: [{ id: 'one', label: 'Uno' }, { id: 'two', label: 'Dos' }],
        renderContent: () => component.create('div'),
      });
      const input = component.create('inputText', { name: 'email', placeholder: 'Correo' });
      const field = component.create('formField', { label: 'Email', input });
      const textArea = component.create('inputTextArea', { name: 'notes', placeholder: 'Notas' });
      const select = component.create('inputSelect', { name: 'status', options: [{ value: 'active', label: 'Activo' }] });
      const email = component.create('inputMail', { name: 'emailAddress' });
      const password = component.create('inputPassword', { name: 'password' });
      const radio = component.create('inputRadio', { name: 'role', value: 'admin' });
      const check = component.create('inputCheck', { name: 'agree' });
      const inputSwitch = component.create('inputSwitch', { name: 'enabled', checked: true });

      assertTrue(breadcrumb.querySelectorAll('a').length === 1, 'breadcrumb links mismatch');
      assertTrue(tabs.querySelectorAll('[data-role="tabs-button"]').length === 2, 'tabs mismatch');
      assertTrue(tabs.querySelector('[data-role="tabs-bar"]') !== null, 'tabs bar missing');
      assertTrue(input instanceof HTMLInputElement, 'input should be an HTMLInputElement');
      assertTrue(field.querySelector('label') !== null, 'form field label missing');
      assertTrue(input.id !== '', 'formField debe asignar un id al input cuando falta');
      assertEquals(field.querySelector('label').getAttribute('for'), input.id, 'label for debe apuntar al id real del input');
      assertTrue(textArea instanceof HTMLTextAreaElement, 'textarea should be a HTMLTextAreaElement');
      assertTrue(select instanceof HTMLElement, 'select wrapper should be an HTMLElement');
      assertTrue(select.dataset.role === 'input-select', 'select wrapper should expose data-role="input-select"');
      assertTrue(select.getInput() instanceof HTMLSelectElement, 'select should wrap a native hidden select');
      assertTrue(select.querySelector('[role="combobox"]') !== null, 'select trigger button missing');
      assertTrue(select.querySelector('[role="listbox"]') !== null, 'select panel missing');
      assertEquals(select.value, 'active', 'select should default to the first/only option value');
      assertTrue(email instanceof HTMLInputElement, 'email input should be an HTMLInputElement');
      assertTrue(password instanceof HTMLInputElement, 'password input should be an HTMLInputElement');
      assertTrue(radio instanceof HTMLInputElement, 'radio should be an HTMLInputElement');
      assertTrue(check instanceof HTMLInputElement, 'check should be an HTMLInputElement');
      assertTrue(inputSwitch.dataset.role === 'input-switch', 'switch root missing');
      assertTrue(inputSwitch.getInput() instanceof HTMLInputElement, 'switch native input missing');
      assertTrue(inputSwitch.getInput().getAttribute('role') === 'switch', 'switch role missing');
      assertTrue(inputSwitch.getChecked(), 'switch checked state mismatch');
    });

    test('inputSelect.setOptions() replaces native options and panel rows, and reactivates a disabled select', () => {
      const select = component.create('inputSelect', { name: 'relation', options: [], disabled: true });
      assertTrue(select.getInput().disabled === true, 'select should start disabled');

      select.setOptions([{ value: 'p1', label: 'Persona 1' }, { value: 'p2', label: 'Persona 2' }]);

      assertTrue(select.getInput().disabled === false, 'setOptions() should reactivate the select by default');
      assertEquals(select.getInput().querySelectorAll('option').length, 2, 'native select should carry the new options');
      assertEquals(select.querySelectorAll('[role="option"]').length, 2, 'panel should carry the new rows');
    });

    test('inputSelect.setOptions() keeps disabled:true when requested explicitly', () => {
      const select = component.create('inputSelect', { name: 'relation', options: [] });

      select.setOptions([], { disabled: true, placeholder: 'No se pudieron cargar las opciones' });

      assertTrue(select.getInput().disabled === true, 'select should stay disabled on explicit error state');
      assertEquals(select.getInput().querySelector('option').textContent, 'No se pudieron cargar las opciones');
    });

    test('inputSelect.setOptions() adds a selectable empty placeholder when requested', () => {
      const select = component.create('inputSelect', { name: 'relation', options: [] });

      select.setOptions([{ value: 'p1', label: 'Persona 1' }], { placeholder: 'Sin asignar' });

      const options = Array.from(select.getInput().querySelectorAll('option'));
      assertEquals(options.length, 2, 'placeholder plus one real option expected');
      assertEquals(options[0].value, '', 'first option should be the empty placeholder');
      assertEquals(options[0].textContent, 'Sin asignar');
    });

    test('inputSelect.setOptions() re-selects the value requested at construction time once it exists', () => {
      const select = component.create('inputSelect', { name: 'relation', options: [], value: 'p2' });
      assertEquals(select.value, '', 'value requested before any matching option exists should not select anything yet');

      select.setOptions([{ value: 'p1', label: 'Persona 1' }, { value: 'p2', label: 'Persona 2' }]);

      assertEquals(select.value, 'p2', 'setOptions() should re-apply the originally requested value once it is available');
    });

    test('breadcrumb soporta separator configurable, iconos y dropdown estilo Ant', () => {
      const breadcrumb = component.create('breadcrumb', {
        separator: '>',
        items: [
          { label: 'Inicio', href: '#/', iconClass: 'fa-solid fa-house' },
          {
            label: 'Componentes',
            href: '#/components',
            menu: [
              { label: 'Navigation', href: '#/components/navigation' },
              { label: 'Data Display', href: '#/components/data-display' },
            ],
          },
          { label: 'Breadcrumb', active: true },
        ],
      });

      const separators = breadcrumb.querySelectorAll('[data-role="breadcrumb-separator"]');
      assertEquals(separators.length, 2, 'separator count mismatch');
      assertTrue(Array.from(separators).every((node) => node.textContent === '>'), 'separator symbol mismatch');

      const icon = breadcrumb.querySelector('i.fa-house');
      assertTrue(icon !== null, 'icon item missing');

      const dropdownTrigger = breadcrumb.querySelector('[data-role="breadcrumb-dropdown-trigger"]');
      assertTrue(dropdownTrigger !== null, 'dropdown trigger missing');
      dropdownTrigger.click();

      const dropdownMenu = breadcrumb.querySelector('[data-role="breadcrumb-dropdown-menu"]');
      assertTrue(dropdownMenu !== null, 'dropdown menu missing');
      assertTrue(dropdownMenu.classList.contains('hidden') === false, 'dropdown menu should open on click');
    });

    test('breadcrumb dropdown closes on outside click and on Escape, not just mouseleave', () => {
      const breadcrumb = component.create('breadcrumb', {
        items: [
          { label: 'Inicio', href: '#/' },
          {
            label: 'Componentes',
            href: '#/components',
            menu: [{ label: 'Navigation', href: '#/components/navigation' }],
          },
          { label: 'Breadcrumb', active: true },
        ],
      });
      document.body.appendChild(breadcrumb);

      try {
        const trigger = breadcrumb.querySelector('[data-role="breadcrumb-dropdown-trigger"]');
        const menu = breadcrumb.querySelector('[data-role="breadcrumb-dropdown-menu"]');

        trigger.click();
        assertTrue(menu.classList.contains('hidden') === false, 'menu should open on trigger click');

        document.body.click();
        assertTrue(menu.classList.contains('hidden') === true, 'menu should close on a click outside the dropdown');

        trigger.click();
        assertTrue(menu.classList.contains('hidden') === false, 'menu should reopen on trigger click');

        document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));
        assertTrue(menu.classList.contains('hidden') === true, 'menu should close on Escape');
      } finally {
        breadcrumb.remove();
      }
    });

    test('inputSwitch exposes state, loading, focus and change behavior', () => {
      let changedTo = null;
      const inputSwitch = component.create('inputSwitch', {
        name: 'published',
        checkedChildren: 'ON',
        unCheckedChildren: 'OFF',
        onChange: (checked) => {
          changedTo = checked;
        },
      });

      inputSwitch.toggle();
      assertTrue(inputSwitch.getChecked(), 'toggle should update checked state');
      assertTrue(changedTo === true, 'toggle should emit the checked state');
      assertEquals(inputSwitch.querySelector('[data-role="switch-content"]').textContent, 'ON', 'checked content mismatch');

      inputSwitch.setLoading(true);
      assertTrue(inputSwitch.getInput().disabled, 'loading switch should be disabled');
      assertTrue(inputSwitch.getAttribute('aria-busy') === 'true', 'loading state should be announced');

      inputSwitch.setLoading(false).setDisabled(true).toggle();
      assertTrue(inputSwitch.getChecked(), 'disabled switch should not toggle');
      inputSwitch.setDisabled(false).setChecked(false);
      assertTrue(!inputSwitch.getChecked(), 'setChecked should update state');
    });

    test('component.create renders tables, empty states and feedback primitives', () => {
      const table = component.create('table', { columns: [{ key: 'name', label: 'Nombre' }], rows: [{ name: 'Item' }] });
      const emptyState = component.create('emptyState', { title: 'Sin datos', description: 'No hay contenido' });
      const alert = component.create('alert', { type: 'success', title: 'Listo', message: 'Todo bien' });
      const modal = component.create('modal', { title: 'Confirmar', content: '¿Continuar?' });
      const spinner = component.create('spinner', { label: 'Cargando...' });
      const skeleton = component.create('skeleton', { rows: 3 });

      assertTrue(table instanceof HTMLElement, 'table wrapper should be an HTMLElement');
      assertTrue(table.querySelector('table') !== null, 'table should render a real table element');
      assertTrue(emptyState.querySelector('[data-role="empty-title"]') !== null, 'empty title missing');
      assertTrue(alert.getAttribute('role') === 'status', 'alert role mismatch');
      assertTrue(alert.classList.contains('rounded-md'), 'alert debe usar rounded-md');
      assertTrue(!alert.classList.contains('rounded-xl'), 'alert no debe conservar rounded-xl');
      assertTrue(!alert.classList.contains('border'), 'alert debe nacer sin borde');
      assertTrue(alert.querySelector('.font-semibold') !== null, 'alert title should be rendered');
      assertTrue(modal.dataset.role === 'ui-modal-overlay', 'modal overlay missing');
      assertTrue(spinner.querySelector('[aria-hidden="true"]') !== null, 'spinner missing');
      assertEquals(skeleton.querySelectorAll('[data-role="skeleton-line"]').length, 3, 'skeleton lines mismatch');
    });

    test('passwordStrength calcula niveles según reglas configurables', () => {
      const rules = [
        { key: 'length', label: 'Longitud', test: (value) => value.length >= 4 },
        { key: 'number', label: 'Número', test: (value) => /\d/.test(value) },
        { key: 'different', label: 'Distinta', test: (value, context) => value !== context.previous },
      ];
      const strength = component.create('passwordStrength', {
        rules,
        value: 'abc1',
        context: { previous: 'old' },
      });
      const result = strength.evaluate();

      assertEquals(strength.querySelectorAll('[data-role="password-rule"]').length, 3, 'Debe renderizar reglas configuradas');
      assertEquals(strength.dataset.levelCount, '4', 'Tres reglas deben generar cuatro niveles');
      assertEquals(result.metRules, 3, 'Debe evaluar callbacks con valor y contexto');
      assertEquals(result.score, 100, 'Todas las reglas deben producir 100%');
      assertEquals(strength.querySelector('[data-role="password-fill"]').dataset.color, 'rgb(22 163 74)', 'El nivel completo debe usar verde sólido');
      assertTrue(!strength.querySelector('[data-role="password-meter"]').className.includes('gradient'), 'La pista no debe usar gradiente');
    });

    test('pageHeader composes title, subtitle and actions container through the factory', () => {
      const header = component.create('pageHeader', {
        title: 'Usuarios',
        subtitle: 'Gestión de usuarios',
        actions: [component.create('button', { label: 'Nuevo', variant: 'primary' })],
        toolbar: [component.create('button', { label: 'Sync', variant: 'secondary' })],
      });

      assertTrue(header instanceof HTMLElement, 'header should be an HTMLElement');
      assertTrue(header.querySelector('[data-role="page-title"]') !== null, 'title node missing');
      assertTrue(header.querySelector('[data-role="page-actions"]') !== null, 'actions container missing');
      assertTrue(header.querySelector('[data-role="page-header-toolbar"]') !== null, 'toolbar container missing');
    });

    test('component factory exposes chainable methods for real UI controls', () => {
      const page = component.create('page').setRole('custom-page');
      const wrapper = component.create('div').setClassName('rounded-2xl').setRole('generic-panel').setParent(page);
      const errorBanner = component.create('alert').setRole('entity-edit-error').setVisible(false).setParent(wrapper);
      const password = component.create('inputPassword').setType('password').setValue('secret').setError('Requerido');

      assertTrue(page instanceof HTMLElement, 'page should be a component instance');
      assertEquals(page.getAttribute('role'), 'custom-page', 'page role mismatch');
      assertEquals(wrapper.getAttribute('role'), 'generic-panel', 'wrapper role mismatch');
      assertTrue(errorBanner.getAttribute('role') === 'entity-edit-error', 'alert role mismatch');
      assertTrue(password instanceof HTMLInputElement, 'password should be an input element');
      assertEquals(password.value, 'secret', 'password value mismatch');
      assertTrue(password.className.includes('border-red'), 'password should expose error styling');
      assertTrue(!password.classList.contains('border-slate-300'), 'setError no debe dejar border-slate-300 enmascarando el borde rojo en reposo');
      assertTrue(!password.classList.contains('focus:border-brand-500'), 'setError no debe dejar focus:border-brand-500 compitiendo con focus:border-red-500');

      password.setError('');
      assertTrue(!password.className.includes('border-red'), 'limpiar el error debe quitar las clases rojas');
      assertTrue(password.classList.contains('border-slate-300'), 'limpiar el error debe restaurar border-slate-300');
      assertTrue(password.classList.contains('focus:border-brand-500'), 'limpiar el error debe restaurar focus:border-brand-500');
    });

    test('los Input* de texto heredan InputComponent.BASE_CLASSNAME en vez de duplicar el literal', () => {
      const originalBase = InputComponent.BASE_CLASSNAME;
      InputComponent.BASE_CLASSNAME = 'test-marker-base-class';
      try {
        ['inputText', 'inputMail', 'inputPhone', 'inputPassword', 'inputDate', 'inputTime', 'inputTextArea'].forEach((name) => {
          const el = component.create(name, { name: 'x' });
          assertEquals(el.className, 'test-marker-base-class', `${name} debe leer InputComponent.BASE_CLASSNAME en vez de un literal propio`);
        });

        // inputSelect's root is a wrapper div; the base classname lands on its trigger button.
        const select = component.create('inputSelect', { name: 'x' });
        const trigger = select.querySelector('[role="combobox"]');
        assertTrue(trigger !== null, 'inputSelect trigger missing');
        assertTrue(trigger.className.includes('test-marker-base-class'), 'inputSelect trigger debe leer InputComponent.BASE_CLASSNAME en vez de un literal propio');
      } finally {
        InputComponent.BASE_CLASSNAME = originalBase;
      }
    });

    test('inputRadio e inputCheck heredan InputComponent.CHECKABLE_CLASSNAME en vez de duplicar el literal', () => {
      const originalCheckable = InputComponent.CHECKABLE_CLASSNAME;
      InputComponent.CHECKABLE_CLASSNAME = 'test-marker-checkable-class';
      try {
        ['inputRadio', 'inputCheck'].forEach((name) => {
          const el = component.create(name, { name: 'x' });
          assertEquals(el.className, 'test-marker-checkable-class', `${name} debe leer InputComponent.CHECKABLE_CLASSNAME en vez de un literal propio`);
        });
      } finally {
        InputComponent.CHECKABLE_CLASSNAME = originalCheckable;
      }
    });

    log('────────────────────────────────────────────────────────────────────────');
    log(`Resultado: ${passed} passed, ${failed} failed`);
    output.innerHTML = output.textContent
      .replaceAll('✅', '<span class="pass">✅</span>')
      .replaceAll('❌', '<span class="fail">❌</span>');
  </script>
</body>
</html>
