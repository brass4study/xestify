<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ApiTest - Xestify Frontend</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
<h2>ApiTest</h2>
<pre id="output"></pre>

<script type="module">
  import { Api, ApiError, setSessionExpiredHandler, setTokenRefreshedHandler } from '../../js/models/ApiClientModel.js';
  import { initTestRunner, separator, test, assertEquals, assertTrue, mockFetch, mockFetchNetworkError, finishTestRunner } from '../js/helpers.js';

  initTestRunner('output');

  // ────────────────────────────────────────────────────────────────────────
  // Tests
  // ────────────────────────────────────────────────────────────────────────

  separator();

  await test('get() sends GET request to correct URL', async () => {
    const req = {};
    mockFetch(200, { ok: true, data: { id: 1 } }, req);
    const api = new Api('/api/v1');
    await api.get('/entities/person/records');
    assertEquals(req.init.method, 'GET');
    assertTrue(req.url.endsWith('/api/v1/entities/person/records'));
  });

  await test('get() returns data from envelope', async () => {
    mockFetch(200, { ok: true, data: { id: 42 }, meta: { total: 1 } });
    const api = new Api('/api/v1');
    const result = await api.get('/things');
    assertEquals(result.data, { id: 42 });
    assertEquals(result.meta, { total: 1 });
  });

  await test('post() sends POST with JSON body', async () => {
    const req = {};
    mockFetch(201, { ok: true, data: { id: 5 } }, req);
    const api = new Api('/api/v1');
    await api.post('/entities/person/records', { name: 'Acme' });
    assertEquals(req.init.method, 'POST');
    assertEquals(JSON.parse(req.init.body), { name: 'Acme' });
  });

  await test('put() sends PUT with JSON body', async () => {
    const req = {};
    mockFetch(200, { ok: true, data: { id: 5 } }, req);
    const api = new Api('/api/v1');
    await api.put('/entities/person/records/5', { name: 'Updated' });
    assertEquals(req.init.method, 'PUT');
    assertEquals(JSON.parse(req.init.body), { name: 'Updated' });
  });

  await test('delete() sends DELETE without body', async () => {
    const req = {};
    mockFetch(200, { ok: true, data: null }, req);
    const api = new Api('/api/v1');
    await api.delete('/entities/person/records/5');
    assertEquals(req.init.method, 'DELETE');
    assertTrue(req.init.body === undefined, 'DELETE must not send body');
  });

  await test('setToken() adds Authorization header', async () => {
    const req = {};
    mockFetch(200, { ok: true, data: {} }, req);
    const api = new Api('/api/v1');
    api.setToken('my-jwt-token');
    await api.get('/things');
    assertEquals(req.init.headers['Authorization'], 'Bearer my-jwt-token');
  });

  await test('sin token no incluye Authorization header', async () => {
    const req = {};
    mockFetch(200, { ok: true, data: {} }, req);
    const api = new Api('/api/v1');
    await api.get('/things');
    assertTrue(!('Authorization' in req.init.headers), 'No debe haber header Authorization');
  });

  await test('setToken(null) elimina el token', async () => {
    const req = {};
    mockFetch(200, { ok: true, data: {} }, req);
    const api = new Api('/api/v1');
    api.setToken('old-token');
    api.setToken(null);
    await api.get('/things');
    assertTrue(!('Authorization' in req.init.headers), 'Token debe haberse eliminado');
  });

  await test('respuesta ok:false lanza ApiError con code y message', async () => {
    mockFetch(401, { ok: false, error: { code: 401, message: 'Unauthorized' } });
    const api = new Api('/api/v1');
    let caught = null;
    try { await api.get('/protected'); } catch (e) { caught = e; }
    assertTrue(caught instanceof ApiError, 'Debe lanzar ApiError');
    assertEquals(caught.code, 401);
    assertEquals(caught.message, 'Unauthorized');
  });

  await test('respuesta 422 incluye details por campo', async () => {
    const details = { email: ['Formato inválido'] };
    mockFetch(422, { ok: false, error: { code: 422, message: 'Validation failed', details } });
    const api = new Api('/api/v1');
    let caught = null;
    try { await api.post('/entities/person/records', {}); } catch (e) { caught = e; }
    assertTrue(caught instanceof ApiError);
    assertEquals(caught.details, details);
  });

  await test('constructor sin baseUrl usa /api/v1 bajo el base path actual', async () => {
    const req = {};
    mockFetch(200, { ok: true, data: {} }, req);
    const api = new Api();
    await api.get('/things');
    assertTrue(req.url.includes('/api/v1/things'), 'La URL debe incluir /api/v1/things');
  });

  await test('error de red lanza ApiError con code 0', async () => {
    mockFetchNetworkError();
    const api = new Api('/api/v1');
    let caught = null;
    try { await api.get('/things'); } catch (e) { caught = e; }
    assertTrue(caught instanceof ApiError, 'Debe lanzar ApiError en error de red');
    assertEquals(caught.code, 0);
  });

  await test('401 con token invoca el handler de sesión caducada antes de lanzar el error', async () => {
    mockFetch(401, { ok: false, error: { code: 401, message: 'Unauthorized' } });
    const api = new Api('/api/v1');
    api.setToken('expired-token');

    let handlerCalls = 0;
    setSessionExpiredHandler(() => { handlerCalls++; });
    try {
      let caught = null;
      try { await api.get('/things'); } catch (e) { caught = e; }
      assertTrue(caught instanceof ApiError, 'El 401 debe seguir lanzando ApiError como antes');
      assertEquals(handlerCalls, 1, 'El handler de sesión caducada debe invocarse exactamente una vez');
    } finally {
      setSessionExpiredHandler(null);
    }
  });

  await test('401 sin token (login con credenciales inválidas) NO invoca el handler de sesión caducada', async () => {
    mockFetch(401, { ok: false, error: { code: 401, message: 'Unauthorized' } });
    const api = new Api('/api/v1');

    let handlerCalls = 0;
    setSessionExpiredHandler(() => { handlerCalls++; });
    try {
      let caught = null;
      try { await api.post('/auth/login', { email: 'a@a.com', password: 'wrong' }); } catch (e) { caught = e; }
      assertTrue(caught instanceof ApiError, 'El 401 debe seguir lanzando ApiError como antes');
      assertEquals(handlerCalls, 0, 'Sin token, un 401 es credenciales inválidas, no sesión caducada');
    } finally {
      setSessionExpiredHandler(null);
    }
  });

  await test('respuesta con cabecera X-Refreshed-Token actualiza el token usado en la siguiente petición', async () => {
    const req = {};
    mockFetch(200, { ok: true, data: {} }, req, { 'X-Refreshed-Token': 'renewed-token' });
    const api = new Api('/api/v1');
    api.setToken('old-token');
    await api.get('/things');

    const req2 = {};
    mockFetch(200, { ok: true, data: {} }, req2);
    await api.get('/things');
    assertEquals(req2.init.headers['Authorization'], 'Bearer renewed-token', 'Las siguientes peticiones deben usar el token renovado');
  });

  await test('respuesta con cabecera X-Refreshed-Token invoca el handler de refresco', async () => {
    mockFetch(200, { ok: true, data: {} }, null, { 'X-Refreshed-Token': 'renewed-token' });
    const api = new Api('/api/v1');
    api.setToken('old-token');

    let receivedToken = null;
    setTokenRefreshedHandler((token) => { receivedToken = token; });
    try {
      await api.get('/things');
      assertEquals(receivedToken, 'renewed-token', 'El handler debe recibir el nuevo token');
    } finally {
      setTokenRefreshedHandler(null);
    }
  });

  await test('respuesta con cabecera X-Refreshed-Token pero sin token previo la ignora', async () => {
    mockFetch(200, { ok: true, data: {} }, null, { 'X-Refreshed-Token': 'renewed-token' });
    const api = new Api('/api/v1');

    let handlerCalls = 0;
    setTokenRefreshedHandler(() => { handlerCalls++; });
    try {
      await api.get('/things');
      assertEquals(handlerCalls, 0, 'Sin token activo (ruta pública) no debe aplicarse ningún refresco');
    } finally {
      setTokenRefreshedHandler(null);
    }
  });

  await test('respuesta sin cabecera X-Refreshed-Token no invoca el handler de refresco', async () => {
    mockFetch(200, { ok: true, data: {} });
    const api = new Api('/api/v1');
    api.setToken('old-token');

    let handlerCalls = 0;
    setTokenRefreshedHandler(() => { handlerCalls++; });
    try {
      await api.get('/things');
      assertEquals(handlerCalls, 0, 'Sin cabecera de refresco no debe invocarse el handler');
    } finally {
      setTokenRefreshedHandler(null);
    }
  });

  // ────────────────────────────────────────────────────────────────────────
  // Summary
  // ────────────────────────────────────────────────────────────────────────

  finishTestRunner('output');
</script>
</body>
</html>
