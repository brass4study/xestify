<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>EntityEditTest - Xestify Frontend</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
<h2>EntityEditTest</h2>
<div id="sandbox" style="display:none"></div>
<pre id="output"></pre>

<script type="module">
  import { EntityEdit } from '../../js/views/pages/EntityEdit.js';
  import { ShellLayout } from '../../js/views/layout/ShellLayout.js';
  import {
    initTestRunner,
    separator,
    test,
    assertEquals,
    assertTrue,
    makeSandbox,
    finishTestRunner
  } from '../js/helpers.js';

  initTestRunner('output');

  const SCHEMA = {
    fields: [
      { name: 'name', label: 'Nombre', type: 'string', required: true },
      { name: 'email', label: 'Email', type: 'email' },
    ],
  };
  const PERSONS_SCHEMA = {
    fields: {
      name: { label: 'Nombre', type: 'string', required: true },
      email: { label: 'Email', type: 'email', required: true },
    },
    custom_fields: [
      { key: 'phone', label: 'Telefono', type: 'string' },
      { key: 'creation_stamp', label: 'Fecha de alta', type: 'timestamp', default: 'now' },
      { key: 'is_active', label: 'Activo', type: 'boolean', default: true },
    ],
  };

  globalThis.fetch = async () => ({
    status: 200,
    json: async () => ({ ok: true, data: { tabs: [] } }),
  });

  function makeShellSandbox() {
    const host = makeSandbox();
    const shell = ShellLayout.create(host).build();
    return { host, shell, content: shell.getTarget('shell-main-content') };
  }

  // -------------------------------------------------------------------------
  // Tests
  // -------------------------------------------------------------------------

  separator();

  await test('constructor throws on missing container', async () => {
    let threw = false;
    try {
      new EntityEdit('#does-not-exist-ever', 'person', SCHEMA);
    } catch {
      threw = true;
    }
    assertTrue(threw, 'Expected TypeError for missing container');
  });

  await test('renders form with schema fields', async () => {
    const container = makeSandbox();
    const page = new EntityEdit(container, 'person', SCHEMA);

    assertTrue(page instanceof EntityEdit, 'EntityEdit instance should be created');
    const inputs = container.querySelectorAll('input');
    assertEquals(inputs.length, 2, 'Should render 2 inputs');
    assertEquals(inputs[0].name, 'name', 'First input should be name');
    assertEquals(inputs[1].name, 'email', 'Second input should be email');
  });

  await test('keeps the canonical form panel and actions as siblings', async () => {
    const container = makeSandbox();
    const page = new EntityEdit(container, 'person', SCHEMA, { onCancel: () => {} });

    const panel = container.querySelector('[data-role="form-panel"]');
    const actions = container.querySelector('[data-role="form-actions"]');

    assertTrue(page instanceof EntityEdit, 'EntityEdit instance should be created');
    assertTrue(container.querySelector('[data-role="entity-edit-page"]') === null, 'Entity edit should not add a page wrapper');
    assertTrue(container.querySelector('[data-role="form-section"]') === null, 'FormLayout should not add a section wrapper');
    assertTrue(panel.className.includes('border'), 'Form panel should own the border');
    assertTrue(panel.className.includes('bg-white'), 'Form panel should own the background');
    assertTrue(panel.className.includes('p-4'), 'Form panel should own the padding');
    assertTrue(actions.parentElement === panel.parentElement, 'Actions should be a sibling of the form panel');
    assertTrue(!actions.className.includes('bg-'), 'Actions should not have a background');
  });

  await test('renders "Nuevo registro" title when no recordId', async () => {
    const { shell, content } = makeShellSandbox();
    const page = new EntityEdit(content, 'person', SCHEMA, { shellLayout: shell });

    assertTrue(page instanceof EntityEdit, 'EntityEdit instance should be created');
    const title = shell.getTarget('shell-header').querySelector('[data-role="page-title"]');
    assertTrue(title !== null, 'Title element should exist');
    assertTrue(title.textContent.includes('Nuevo'), 'Title should say Nuevo registro');
  });

  await test('renders "Editar registro" title when recordId is provided', async () => {
    const { shell, content } = makeShellSandbox();
    const page = new EntityEdit(content, 'person', SCHEMA, { recordId: '42', shellLayout: shell });

    assertTrue(page instanceof EntityEdit, 'EntityEdit instance should be created');
    const title = shell.getTarget('shell-header').querySelector('[data-role="page-title"]');
    assertTrue(title.textContent.includes('Editar'), 'Title should say Editar registro');
  });

  await test('pre-fills form with initialData', async () => {
    const container = makeSandbox();
    const page = new EntityEdit(container, 'person', SCHEMA, {
      initialData: { name: 'ACME', email: 'info@acme.com' },
    });

    assertTrue(page instanceof EntityEdit, 'EntityEdit instance should be created');
    const nameInput = container.querySelector('[name="name"]');
    const emailInput = container.querySelector('[name="email"]');
    assertEquals(nameInput.value, 'ACME', 'name input should be pre-filled');
    assertEquals(emailInput.value, 'info@acme.com', 'email input should be pre-filled');
  });

  await test('pre-fills form when schema.fields is an object map', async () => {
    const container = makeSandbox();
    const schema = {
      fields: {
        name: { label: 'Nombre', type: 'string', required: true },
        email: { label: 'Email', type: 'email', required: true },
      },
    };

    const page = new EntityEdit(container, 'persons', schema, {
      initialData: { name: 'Cliente test', email: 'cliente.test@example.com' },
    });

    assertTrue(page instanceof EntityEdit, 'EntityEdit instance should be created');
    const nameInput = container.querySelector('[name="name"]');
    const emailInput = container.querySelector('[name="email"]');
    assertEquals(nameInput.value, 'Cliente test', 'name input should be pre-filled from object schema');
    assertEquals(emailInput.value, 'cliente.test@example.com', 'email input should be pre-filled from object schema');
  });

  await test('pre-fills custom_fields from initialData', async () => {
    const container = makeSandbox();
    const page = new EntityEdit(container, 'persons', PERSONS_SCHEMA, {
      initialData: {
        name: 'Cliente test',
        email: 'cliente.test@example.com',
        phone: '+34 600 000 000',
        creation_stamp: '2026-05-11T09:00:00Z',
        is_active: false,
      },
    });

    assertTrue(page instanceof EntityEdit, 'EntityEdit instance should be created');
    assertEquals(container.querySelector('[name="phone"]').value, '+34 600 000 000');
    assertEquals(container.querySelector('[name="creation_stamp"]').value, '2026-05-11T09:00:00Z');
    assertTrue(container.querySelector('[name="is_active"]').checked === false, 'is_active should be unchecked');
  });

  await test('submit() POST to /entities/:slug/records on create', async () => {
    const container = makeSandbox();
    let capturedUrl = null;
    let capturedBody = null;

    globalThis.fetch = async (url, init) => {
      capturedUrl = url;
      capturedBody = JSON.parse(init.body);
      return { status: 201, json: async () => ({ ok: true, data: { id: 1, name: 'ACME' } }) };
    };

    const page = new EntityEdit(container, 'person', SCHEMA);
    container.querySelector('[name="name"]').value = 'ACME';
    container.querySelector('[name="email"]').value = 'info@acme.com';
    await page.submit();

    assertTrue(capturedUrl.includes('/entities/person/records'), 'Should POST to correct URL');
    assertEquals(capturedBody.name, 'ACME', 'Body should contain name');
  });

  await test('submit() includes custom_fields in request body', async () => {
    const container = makeSandbox();
    let capturedBody = null;

    globalThis.fetch = async (_url, init) => {
      capturedBody = JSON.parse(init.body);
      return { status: 201, json: async () => ({ ok: true, data: { id: 1, ...capturedBody } }) };
    };

    const page = new EntityEdit(container, 'persons', PERSONS_SCHEMA);
    container.querySelector('[name="name"]').value = 'ACME';
    container.querySelector('[name="email"]').value = 'info@acme.com';
    container.querySelector('[name="phone"]').value = '+34 600 000 000';
    container.querySelector('[name="creation_stamp"]').value = 'now';
    container.querySelector('[name="is_active"]').checked = true;
    await page.submit();

    assertEquals(capturedBody.phone, '+34 600 000 000', 'Body should contain phone');
    assertEquals(capturedBody.creation_stamp, 'now', 'Body should contain creation_stamp');
    assertEquals(capturedBody.is_active, true, 'Body should contain is_active');
  });

  await test('submit() PUT to /entities/:slug/records/:id on edit', async () => {
    const container = makeSandbox();
    let capturedMethod = null;
    let capturedUrl = null;

    globalThis.fetch = async (url, init) => {
      capturedMethod = init.method;
      capturedUrl = url;
      return { status: 200, json: async () => ({ ok: true, data: { id: '7', name: 'Updated' } }) };
    };

    const page = new EntityEdit(container, 'person', SCHEMA, { recordId: '7' });
    container.querySelector('[name="name"]').value = 'Updated';
    await page.submit();

    assertEquals(capturedMethod, 'PUT', 'Should use PUT method');
    assertTrue(capturedUrl.includes('/entities/person/records/7'), 'URL should include record id');
  });

  await test('submit() calls onSaved with saved record', async () => {
    const container = makeSandbox();
    const saved = { id: 1, name: 'ACME' };
    globalThis.fetch = async () => ({ status: 201, json: async () => ({ ok: true, data: saved }) });

    let calledWith = null;
    const page = new EntityEdit(container, 'person', SCHEMA, {
      onSaved: (record) => { calledWith = record; },
    });
    container.querySelector('[name="name"]').value = 'ACME';
    await page.submit();

    assertEquals(calledWith, saved, 'onSaved should be called with the saved record');
  });

  await test('submit() shows field errors from ApiError.details', async () => {
    const container = makeSandbox();
    globalThis.fetch = async () => ({
      status: 422,
      json: async () => ({
        ok: false,
        error: { code: 422, message: 'Validation failed', details: { name: ['Too short'] } },
      }),
    });

    const page = new EntityEdit(container, 'person', SCHEMA);
    container.querySelector('[name="name"]').value = 'X';
    await page.submit();

    const errorList = container.querySelector('[data-role="field-errors"][data-field="name"]');
    assertTrue(errorList !== null, 'Field error list should be rendered');
    assertTrue(errorList.textContent.includes('Too short'), 'Error message should be shown');
  });

  await test('submit() shows structured API validation errors', async () => {
    const container = makeSandbox();
    const productSchema = {
      fields: [
        { name: 'name', label: 'Nombre', type: 'string', required: true },
        { name: 'description', label: 'Descripcion', type: 'text' },
      ],
    };
    globalThis.fetch = async () => ({
      status: 422,
      json: async () => ({
        ok: false,
        error: {
          code: 422,
          message: 'Validation failed',
          details: [
            { field: 'description', code: 'invalid_type', message: 'Expected text' },
          ],
        },
      }),
    });

    const page = new EntityEdit(container, 'products', productSchema);
    container.querySelector('[name="name"]').value = 'Producto test';
    container.querySelector('[name="description"]').value = 'Descripcion';
    await page.submit();

    const errorList = container.querySelector('[data-role="field-errors"][data-field="description"]');
    assertTrue(errorList !== null, 'Structured field error list should be rendered');
    assertTrue(errorList.textContent.includes('Expected text'), 'Structured error message should be shown');
    assertTrue(!errorList.textContent.includes('[object Object]'), 'Structured errors must not render as object text');
  });

  await test('submit() shows global error banner on generic ApiError', async () => {
    const container = makeSandbox();
    globalThis.fetch = async () => ({
      status: 500,
      json: async () => ({ ok: false, error: { code: 500, message: 'Server error', details: {} } }),
    });

    const page = new EntityEdit(container, 'person', SCHEMA);
    container.querySelector('[name="name"]').value = 'ACME';
    await page.submit();

    const banner = container.querySelector('[data-role="entity-edit-error"]');
    assertTrue(banner !== null && !banner.hidden, 'Error banner should be visible');
    assertTrue(banner.textContent.includes('Server error'), 'Banner should show error message');
  });

  await test('submit() allows retry after a validation failure on first attempt', async () => {
    const container = makeSandbox();
    let postCount = 0;
    globalThis.fetch = async (_url, init) => {
      if ((init?.method ?? 'GET') !== 'POST') {
        return { status: 200, json: async () => ({ ok: true, data: { tabs: [] } }) };
      }
      postCount += 1;
      const body = JSON.parse(init.body);
      return { status: 201, json: async () => ({ ok: true, data: { id: 1, ...body } }) };
    };

    const page = new EntityEdit(container, 'person', SCHEMA);

    // First attempt: required "name" field left empty, validation must fail
    // client-side without ever reaching fetch().
    await page.submit();
    assertEquals(postCount, 0, 'First invalid submit should not call the API');

    const saveBtn = container.querySelector('[data-role="entity-edit-save"]');
    assertTrue(saveBtn !== null && saveBtn.disabled !== true, 'Save button must not stay disabled after a validation failure');

    // Second attempt: fix the field and retry — this must actually submit,
    // not silently no-op because #isSubmitting was left stuck at true.
    container.querySelector('[name="name"]').value = 'ACME';
    await page.submit();

    assertEquals(postCount, 1, 'Retry after fixing validation errors should reach the API');
  });

  await test('pulsar Enter en un campo dispara el guardado via el evento submit del formulario', async () => {
    const container = makeSandbox();
    let capturedUrl = null;
    let capturedBody = null;

    globalThis.fetch = async (url, init) => {
      capturedUrl = url;
      capturedBody = JSON.parse(init.body);
      return { status: 201, json: async () => ({ ok: true, data: { id: 1, name: 'ACME' } }) };
    };

    const page = new EntityEdit(container, 'person', SCHEMA);
    assertTrue(page instanceof EntityEdit, 'EntityEdit instance should be created');
    container.querySelector('[name="name"]').value = 'ACME';
    container.querySelector('[name="email"]').value = 'info@acme.com';

    const form = container.querySelector('form');
    assertTrue(form !== null, 'DynamicForm debe renderizar un <form> real');
    // El navegador convierte Enter dentro de un input en un evento "submit"
    // nativo del <form> que lo contiene; lo simulamos directamente.
    form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
    await new Promise((resolve) => setTimeout(resolve, 0));

    assertTrue(capturedUrl !== null && capturedUrl.includes('/entities/person/records'), 'El submit del formulario debe llegar a la API igual que el botón Guardar');
    assertEquals(capturedBody.name, 'ACME', 'El body debe contener name');
  });

  await test('cancel button calls onCancel callback', async () => {
    const container = makeSandbox();
    let cancelled = false;
    const page = new EntityEdit(container, 'person', SCHEMA, { onCancel: () => { cancelled = true; } });

    assertTrue(page instanceof EntityEdit, 'EntityEdit instance should be created');
    const cancelBtn = container.querySelector('[data-role="entity-edit-cancel"]');
    assertTrue(cancelBtn !== null, 'Cancel button should exist when onCancel is provided');
    cancelBtn.click();
    assertTrue(cancelled, 'onCancel should have been called');
  });

  await test('cancel button is absent when no onCancel provided', async () => {
    const container = makeSandbox();
    const page = new EntityEdit(container, 'person', SCHEMA);

    assertTrue(page instanceof EntityEdit, 'EntityEdit instance should be created');
    const cancelBtn = container.querySelector('[data-role="entity-edit-cancel"]');
    assertTrue(cancelBtn === null, 'Cancel button should not exist without onCancel');
  });

  // ────────────────────────────────────────────────────────────────────────
  // Delete button
  // ────────────────────────────────────────────────────────────────────────

  await test('delete button is absent in create mode (no recordId)', async () => {
    const container = makeSandbox();
    const page = new EntityEdit(container, 'person', SCHEMA, { onDelete: () => {} });

    assertTrue(page instanceof EntityEdit, 'EntityEdit instance should be created');
    const deleteBtn = container.querySelector('[data-role="entity-edit-delete"]');
    assertTrue(deleteBtn === null, 'Delete button should not exist without a recordId');
  });

  await test('delete button is absent without onDelete callback', async () => {
    const container = makeSandbox();
    const page = new EntityEdit(container, 'person', SCHEMA, { recordId: '7' });

    assertTrue(page instanceof EntityEdit, 'EntityEdit instance should be created');
    const deleteBtn = container.querySelector('[data-role="entity-edit-delete"]');
    assertTrue(deleteBtn === null, 'Delete button should not exist without onDelete');
  });

  await test('delete button appears in edit mode with onDelete provided', async () => {
    const container = makeSandbox();
    const page = new EntityEdit(container, 'person', SCHEMA, { recordId: '7', onDelete: () => {} });

    assertTrue(page instanceof EntityEdit, 'EntityEdit instance should be created');
    const deleteBtn = container.querySelector('[data-role="entity-edit-delete"]');
    assertTrue(deleteBtn !== null, 'Delete button should exist with a recordId and onDelete');
  });

  await test('confirming the delete modal calls DELETE and invokes onDelete', async () => {
    const container = makeSandbox();
    let capturedMethod = null;
    let capturedUrl = null;
    globalThis.fetch = async (url, init) => {
      const method = init?.method ?? 'GET';
      if (method === 'DELETE') {
        capturedMethod = method;
        capturedUrl = url;
        return { status: 200, json: async () => ({ ok: true, data: { deleted: true, id: '7' } }) };
      }
      return { status: 200, json: async () => ({ ok: true, data: { tabs: [] } }) };
    };

    let deletedId = null;
    const page = new EntityEdit(container, 'person', SCHEMA, {
      recordId: '7',
      onDelete: (id) => { deletedId = id; },
    });
    assertTrue(page instanceof EntityEdit, 'EntityEdit instance should be created');

    container.querySelector('[data-role="entity-edit-delete"]').click();
    const confirmButton = container.querySelector('[data-action="confirm-modal"]');
    assertTrue(confirmButton instanceof HTMLButtonElement, 'Confirmation modal should render a confirm button');
    confirmButton.click();
    await new Promise((resolve) => setTimeout(resolve, 0));

    assertEquals(capturedMethod, 'DELETE', 'Should call DELETE');
    assertTrue(String(capturedUrl).includes('/entities/person/records/7'), 'URL should target the record being edited');
    assertEquals(deletedId, '7', 'onDelete should be called with the record id');
  });

  await test('cancelling the delete modal does not call DELETE', async () => {
    const container = makeSandbox();
    let deleteCalled = false;
    globalThis.fetch = async (_url, init) => {
      if ((init?.method ?? 'GET') === 'DELETE') {
        deleteCalled = true;
      }
      return { status: 200, json: async () => ({ ok: true, data: { tabs: [] } }) };
    };

    const page = new EntityEdit(container, 'person', SCHEMA, { recordId: '7', onDelete: () => {} });
    assertTrue(page instanceof EntityEdit, 'EntityEdit instance should be created');

    container.querySelector('[data-role="entity-edit-delete"]').click();
    container.querySelector('[data-action="cancel-modal"]').click();
    await new Promise((resolve) => setTimeout(resolve, 0));

    assertTrue(!deleteCalled, 'Cancelling must not call DELETE');
  });

  // ────────────────────────────────────────────────────────────────────────
  // Reverse relation tab (STORY 10.3 §9)
  // ────────────────────────────────────────────────────────────────────────

  function mockRelationFetch(relatedRecords) {
    return async (url) => {
      const u = String(url);
      if (u.includes('/entities/persons/tabs')) {
        return {
          status: 200,
          json: async () => ({
            ok: true,
            data: {
              tabs: [
                { id: 'relation-orders-id_person', label: 'Pedidos', type: 'relation', source_entity: 'orders', key: 'id_person' },
              ],
            },
          }),
        };
      }
      if (u.includes('/entities/orders/records')) {
        return { status: 200, json: async () => ({ ok: true, data: relatedRecords }) };
      }
      if (u.includes('/entities/orders/schema')) {
        return {
          status: 200,
          json: async () => ({
            ok: true,
            data: { entity_slug: 'orders', schema: { fields: { title: { label: 'Titulo', type: 'string' } } } },
          }),
        };
      }
      return { status: 200, json: async () => ({ ok: true, data: { tabs: [] } }) };
    };
  }

  await test('muestra un RelatedRecordsPanel para una tab de tipo relation, sin intentar importar un plugin.js', async () => {
    const { host, shell, content } = makeShellSandbox();
    globalThis.fetch = mockRelationFetch([
      { id: 'rec-1', content: { title: 'Pedido 1' }, created_at: null, updated_at: null },
    ]);

    const page = new EntityEdit(content, 'persons', SCHEMA, { recordId: '42', shellLayout: shell });
    assertTrue(page instanceof EntityEdit, 'EntityEdit instance should be created');
    await new Promise((resolve) => setTimeout(resolve, 60));

    const relationTabButton = host.querySelector('[data-tab-id="relation-orders-id_person"]');
    assertTrue(relationTabButton !== null, 'La tab de relacion inversa debe renderizarse');
    assertTrue(relationTabButton.textContent.includes('Pedidos'), 'La tab debe mostrar la etiqueta de la relacion');

    relationTabButton.click();
    await new Promise((resolve) => setTimeout(resolve, 20));

    const panel = host.querySelector('[data-role="related-records-panel"]');
    assertTrue(panel !== null, 'El panel de registros relacionados debe montarse al activar la tab');
    assertTrue(panel.textContent.includes('Pedido 1'), 'El panel debe mostrar el registro relacionado devuelto por la API');
  });

  await test('el panel de relacion muestra un mensaje vacio cuando no hay registros relacionados', async () => {
    const { host, shell, content } = makeShellSandbox();
    globalThis.fetch = mockRelationFetch([]);

    const page = new EntityEdit(content, 'persons', SCHEMA, { recordId: '42', shellLayout: shell });
    assertTrue(page instanceof EntityEdit, 'EntityEdit instance should be created');
    await new Promise((resolve) => setTimeout(resolve, 60));

    host.querySelector('[data-tab-id="relation-orders-id_person"]').click();
    await new Promise((resolve) => setTimeout(resolve, 20));

    const panel = host.querySelector('[data-role="related-records-panel"]');
    assertTrue(panel !== null, 'El panel debe montarse aunque no haya registros');
    assertTrue(panel.textContent.includes('Sin registros relacionados'), 'Debe mostrar el mensaje de lista vacia');
  });

  await test('pulsar un registro relacionado llama a onNavigateToRecord con la entidad origen y el id', async () => {
    const { host, shell, content } = makeShellSandbox();
    globalThis.fetch = mockRelationFetch([
      { id: 'rec-1', content: { title: 'Pedido 1' }, created_at: null, updated_at: null },
    ]);

    let navigatedTo = null;
    const page = new EntityEdit(content, 'persons', SCHEMA, {
      recordId: '42',
      shellLayout: shell,
      onNavigateToRecord: (sourceSlug, recordId) => {
        navigatedTo = { sourceSlug, recordId };
      },
    });
    assertTrue(page instanceof EntityEdit, 'EntityEdit instance should be created');
    await new Promise((resolve) => setTimeout(resolve, 60));

    host.querySelector('[data-tab-id="relation-orders-id_person"]').click();
    await new Promise((resolve) => setTimeout(resolve, 20));

    const row = host.querySelector('[data-role="related-records-panel"] tbody tr');
    assertTrue(row !== null, 'Debe renderizarse una fila para el registro relacionado');
    row.click();

    assertTrue(navigatedTo !== null, 'onNavigateToRecord debe haberse llamado');
    assertEquals(navigatedTo.sourceSlug, 'orders', 'Debe navegar a la entidad origen de la relacion');
    assertEquals(navigatedTo.recordId, 'rec-1', 'Debe navegar al id del registro pulsado');
  });

  // ────────────────────────────────────────────────────────────────────────
  // Relation field options (belongs_to select on the entity's own form)
  // ────────────────────────────────────────────────────────────────────────

  const ORDER_SCHEMA = {
    fields: [
      { name: 'total', label: 'Total', type: 'number', required: true },
    ],
    relations: [
      { key: 'id_person', type: 'belongs_to', target_entity: 'persons', target_field: 'id', label: 'Cliente', required: true },
    ],
  };

  function mockOptionsFetch(options, { failOptions = false } = {}) {
    return async (url, init) => {
      const u = String(url);
      if (u.includes('/entities/orders/tabs')) {
        return { status: 200, json: async () => ({ ok: true, data: { tabs: [] } }) };
      }
      if (u.includes('/entities/persons/options')) {
        if (failOptions) {
          throw new Error('network error');
        }
        return { status: 200, json: async () => ({ ok: true, data: options }) };
      }
      const body = init?.body ? JSON.parse(init.body) : {};
      return { status: 201, json: async () => ({ ok: true, data: { id: 'o1', ...body } }) };
    };
  }

  await test('un schema con relations[] renderiza un select deshabilitado inicialmente', async () => {
    const container = makeSandbox();
    globalThis.fetch = mockOptionsFetch([{ id: 'p1', label: 'Persona 1' }]);

    const page = new EntityEdit(container, 'orders', ORDER_SCHEMA);
    assertTrue(page instanceof EntityEdit, 'EntityEdit instance should be created');

    const select = container.querySelector('select[name="id_person"]');
    assertTrue(select !== null, 'debe renderizarse un select para la relacion');
    assertTrue(select.disabled === true, 'el select debe empezar deshabilitado mientras se resuelven las opciones');
  });

  await test('el select de relacion se hidrata tras la peticion fire-and-forget a /entities/{target}/options', async () => {
    const container = makeSandbox();
    globalThis.fetch = mockOptionsFetch([{ id: 'p1', label: 'Persona 1' }, { id: 'p2', label: 'Persona 2' }]);

    const page = new EntityEdit(container, 'orders', ORDER_SCHEMA);
    assertTrue(page instanceof EntityEdit, 'EntityEdit instance should be created');
    await new Promise((resolve) => setTimeout(resolve, 30));

    const select = container.querySelector('select[name="id_person"]');
    assertTrue(select.disabled === false, 'el select debe reactivarse tras recibir las opciones reales');
    const optionLabels = new Set(Array.from(select.querySelectorAll('option')).map((o) => o.textContent));
    assertTrue(optionLabels.has('Persona 1') && optionLabels.has('Persona 2'), 'las opciones deben venir del endpoint de opciones');
  });

  await test('en modo edicion, initialData[relation.key] queda preseleccionado tras hidratar', async () => {
    const container = makeSandbox();
    globalThis.fetch = mockOptionsFetch([{ id: 'p1', label: 'Persona 1' }, { id: 'p2', label: 'Persona 2' }]);

    const page = new EntityEdit(container, 'orders', ORDER_SCHEMA, {
      recordId: 'ord-1',
      initialData: { id_person: 'p2', total: 25 },
    });
    assertTrue(page instanceof EntityEdit, 'EntityEdit instance should be created');
    await new Promise((resolve) => setTimeout(resolve, 30));

    const select = container.querySelector('select[name="id_person"]');
    assertEquals(select.value, 'p2', 'la persona guardada en el registro debe quedar preseleccionada sin interaccion manual');
  });

  await test('si la peticion de opciones falla, el select queda deshabilitado con error sin romper el resto del formulario', async () => {
    const container = makeSandbox();
    globalThis.fetch = mockOptionsFetch([], { failOptions: true });

    const page = new EntityEdit(container, 'orders', ORDER_SCHEMA);
    assertTrue(page instanceof EntityEdit, 'EntityEdit instance should be created');
    await new Promise((resolve) => setTimeout(resolve, 30));

    const select = container.querySelector('select[name="id_person"]');
    assertTrue(select.disabled === true, 'el select debe quedar deshabilitado si falla la carga de opciones');
    assertTrue(select.querySelector('option').textContent.includes('No se pudieron cargar'), 'debe mostrar un mensaje de error como placeholder');
    assertTrue(container.querySelector('input[name="total"]') !== null, 'el resto del formulario debe seguir funcionando');
  });

  await test('submit() incluye el value del campo de relacion en el body', async () => {
    const container = makeSandbox();
    let capturedBody = null;
    globalThis.fetch = async (url, init) => {
      const u = String(url);
      if (u.includes('/entities/orders/tabs')) {
        return { status: 200, json: async () => ({ ok: true, data: { tabs: [] } }) };
      }
      if (u.includes('/entities/persons/options')) {
        return { status: 200, json: async () => ({ ok: true, data: [{ id: 'p1', label: 'Persona 1' }] }) };
      }
      capturedBody = JSON.parse(init.body);
      return { status: 201, json: async () => ({ ok: true, data: { id: 'o1', ...capturedBody } }) };
    };

    const page = new EntityEdit(container, 'orders', ORDER_SCHEMA);
    await new Promise((resolve) => setTimeout(resolve, 30));

    container.querySelector('input[name="total"]').value = '99';
    container.querySelector('select[name="id_person"]').value = 'p1';
    await page.submit();

    assertEquals(capturedBody.id_person, 'p1', 'el body enviado debe incluir el value seleccionado en el campo de relacion');
  });

  // ────────────────────────────────────────────────────────────────────────
  // Summary
  // ────────────────────────────────────────────────────────────────────────

  finishTestRunner('output');
</script>
