<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>EntityRecordModelTest - Xestify Frontend</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
<h2>EntityRecordModelTest</h2>
<pre id="output"></pre>

<script type="module">
  import { recordSummaryLabel } from '../../js/models/EntityRecordModel.js';
  import { initTestRunner, separator, test, assertEquals, finishTestRunner } from '../js/helpers.js';

  initTestRunner('output');

  const SCHEMA = {
    fields: {
      name: { type: 'string', label: 'Nombre' },
    },
    custom_fields: [
      { key: 'surnames', type: 'string', label: 'Apellidos', summaryView: true },
      { key: 'phone', type: 'string', label: 'Telefono', summaryView: false },
    ],
  };

  separator();

  await test('concatena fields antes que custom_fields, respetando el orden de declaracion', async () => {
    const label = recordSummaryLabel(SCHEMA, { name: 'Juan', surnames: 'Perez', phone: '555' }, 'fallback-id');
    assertEquals(label, 'Juan Perez', 'Debe unir name y surnames con espacio, en ese orden, excluyendo phone');
  });

  await test('un campo sin summaryView explicito cuenta por defecto (true implicito)', async () => {
    const schema = {
      fields: { name: { type: 'string', label: 'Nombre' } },
      custom_fields: [],
    };
    const label = recordSummaryLabel(schema, { name: 'Ana' }, 'fallback-id');
    assertEquals(label, 'Ana', 'Un campo de fields sin summaryView debe incluirse');
  });

  await test('summaryView === false excluye el campo aunque tenga valor', async () => {
    const label = recordSummaryLabel(SCHEMA, { name: 'Juan', surnames: 'Perez', phone: '555-1234' }, 'fallback-id');
    assertEquals(label.includes('555'), false, 'El valor de phone (summaryView: false) no debe aparecer en el resumen');
  });

  await test('cae al fallbackId cuando no hay ningun valor de resumen', async () => {
    const label = recordSummaryLabel(SCHEMA, {}, 'fallback-id');
    assertEquals(label, 'fallback-id', 'Sin contenido, debe devolver el fallbackId');
  });

  await test('cae al fallbackId cuando los valores de resumen estan vacios tras el trim', async () => {
    const label = recordSummaryLabel(SCHEMA, { name: '   ', surnames: '' }, 'fallback-id');
    assertEquals(label, 'fallback-id', 'Valores en blanco no deben contar como contenido');
  });

  await test('ignora valores no escalares (objetos/arrays anidados)', async () => {
    const label = recordSummaryLabel(SCHEMA, { name: { nested: true }, surnames: 'Perez' }, 'fallback-id');
    assertEquals(label, 'Perez', 'Un valor objeto debe descartarse, dejando solo el resto de campos escalares');
  });

  await test('funciona con schema/content vacios sin lanzar error', async () => {
    const label = recordSummaryLabel({}, {}, 'abc-123');
    assertEquals(label, 'abc-123', 'Schema y content vacios deben caer al fallbackId sin excepciones');
  });

  await test('type + name + surnames tienen prioridad y se muestran en ese orden', async () => {
    const schema = {
      fields: {
        surnames: { type: 'string', label: 'Apellidos' },
        name: { type: 'string', label: 'Nombre' },
      },
      custom_fields: [
        { key: 'type', type: 'select', label: 'Tipo', options: [{ value: 'optometrist', label: 'Optometrista' }] },
        { key: 'notes', type: 'string', label: 'Notas', summaryView: true },
      ],
    };
    const label = recordSummaryLabel(
      schema,
      { name: 'Javier', surnames: 'Jimenez Alvarez', type: 'optometrist', notes: 'irrelevante' },
      'fallback-id'
    );
    assertEquals(label, 'Optometrista Javier Jimenez Alvarez', 'Debe usar el orden fijo type, name, surnames e ignorar el resto de summaryView:true');
  });

  await test('sin surnames, type + name + description tienen prioridad', async () => {
    const schema = {
      fields: {
        name: { type: 'string', label: 'Nombre' },
        type: { type: 'string', label: 'Tipo' },
      },
      custom_fields: [
        { key: 'description', type: 'string', label: 'Descripcion', summaryView: true },
      ],
    };
    const label = recordSummaryLabel(schema, { name: 'Producto X', type: 'lente', description: 'Lente progresiva' }, 'fallback-id');
    assertEquals(label, 'lente Producto X Lente progresiva', 'Sin surnames declarado debe caer a type, name, description');
  });

  await test('un campo select resuelve su label declarado en options, no el value crudo', async () => {
    const schema = {
      fields: { name: { type: 'string', label: 'Nombre' } },
      custom_fields: [
        { key: 'surnames', type: 'string', label: 'Apellidos', summaryView: true },
        { key: 'type', type: 'select', label: 'Tipo', options: [
          { value: 'ophthalmologist', label: 'Oftalmologo' },
          { value: 'optometrist', label: 'Optometrista' },
        ] },
      ],
    };
    const label = recordSummaryLabel(schema, { name: 'Javier', surnames: 'Jimenez Alvarez', type: 'optometrist' }, 'fallback-id');
    assertEquals(label, 'Optometrista Javier Jimenez Alvarez', 'El value "optometrist" debe resolverse a su label "Optometrista"');
  });

  await test('sin type/name/surnames ni type/name/description, usa los 2 primeros summaryView en orden de visualizacion', async () => {
    const schema = {
      fields: {
        sku: { type: 'string', label: 'SKU', summaryView: true },
        name: { type: 'string', label: 'Nombre', summaryView: true },
      },
      custom_fields: [
        { key: 'price', type: 'number', label: 'Precio', summaryView: true },
      ],
      ui_field_order: ['name', 'price', 'sku'],
    };
    const label = recordSummaryLabel(schema, { sku: 'SKU-1', name: 'Producto', price: 9.99 }, 'fallback-id');
    assertEquals(label, 'Producto 9.99', 'Debe respetar ui_field_order (name, price) e ignorar sku aunque venga primero en la declaracion');
  });

  finishTestRunner('output');
</script>
</body>
</html>
