<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FrontendArchitectureTest - Xestify Frontend</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <h2>FrontendArchitectureTest</h2>
  <pre id="output"></pre>

  <script type="module">
    import {
      initTestRunner,
      test,
      assertEquals,
      assertTrue,
      finishTestRunner,
    } from '../js/helpers.js';
    import { RouteController } from '../../js/controllers/RouteController.js';
    import {
      entityCreatePage,
      entityPage,
      entityRecordPage,
      entityTabPage,
      getPageFromHash,
      HASH_ROUTE_MAP,
      hashFromPage,
      parseEntityRecordPage,
      pluginConfigPage,
      userDetailPage,
    } from '../../js/controllers/RouteMapController.js';
    import { PluginRouteController } from '../../js/controllers/PluginRouteController.js';
    import { ShellLayout } from '../../js/views/layout/ShellLayout.js';
    import { PageLayout } from '../../js/views/layout/PageLayout.js';
    import { ListLayout } from '../../js/views/layout/ListLayout.js';
    import { FormLayout } from '../../js/views/layout/FormLayout.js';
    import { Navbar } from '../../js/views/modules/Navbar.js';
    import { component } from '../../js/views/modules/ComponentFactory.js';

    initTestRunner('output');

    function fillTemplate(template, ...params) {
      let index = 0;
      return template.replace(/:[a-zA-Z]+/g, () => encodeURIComponent(params[index++] ?? ''));
    }

    await test('RouteController soporta entrada directa, refresh y navegación programática por hash', async () => {
      const originalUrl = `${window.location.pathname}${window.location.search}${window.location.hash}`;
      const visited = [];
      const router = new RouteController({
        onNavigate: async (page) => visited.push(page),
      });

      window.history.replaceState(null, '', '#/users/user-7');
      await router.start('entity:persons');

      const navigationCount = visited.length;
      await router.navigate(getPageFromHash('#/profile', router.fallbackPage), { updateHash: true, notify: false });
      assertEquals(window.location.hash, '#/profile', 'Debe actualizar el hash sin despachar la página');
      assertEquals(visited.length, navigationCount, 'notify false no debe invocar onNavigate');

      await router.navigate(getPageFromHash('#/entity/persons/record-9/comments', router.fallbackPage), { updateHash: true });

      assertEquals(visited[0], 'users:user-7', 'Debe resolver la entrada directa por hash');
      assertEquals(visited.at(-1), 'entity-tab:persons:record-9:comments', 'Debe navegar a un token de página resuelto a partir de un hash público');
      assertEquals(window.location.hash, '#/entity/persons/record-9/comments', 'Debe sincronizar el hash programático');

      router.stop();
      const restarted = new RouteController({
        onNavigate: async (page) => visited.push(page),
      });
      await restarted.start('entity:persons');

      assertEquals(visited.at(-1), 'entity-tab:persons:record-9:comments', 'Debe restaurar la vista tras reiniciar con el hash preservado');
      restarted.stop();
      window.history.replaceState(null, '', originalUrl);
    });

    await test('RouteController restaura contexto con back y forward', async () => {
      const originalUrl = `${window.location.pathname}${window.location.search}${window.location.hash}`;
      const visited = [];
      const router = new RouteController({
        onNavigate: async (page) => visited.push(page),
      });

      window.history.replaceState(null, '', '#/entity/persons/record-9');
      await router.start('home');
      await router.navigate(getPageFromHash('#/entity/persons/record-9/comments', router.fallbackPage), { updateHash: true });
      await router.navigate(getPageFromHash('#/profile', router.fallbackPage), { updateHash: true });

      const backNavigation = new Promise((resolve) => window.addEventListener('hashchange', resolve, { once: true }));
      window.history.back();
      await backNavigation;
      assertEquals(visited.at(-1), 'entity-tab:persons:record-9:comments', 'Back debe recuperar registro y tab');

      const forwardNavigation = new Promise((resolve) => window.addEventListener('hashchange', resolve, { once: true }));
      window.history.forward();
      await forwardNavigation;
      assertEquals(visited.at(-1), 'profile', 'Forward debe recuperar la vista siguiente');

      router.stop();
      window.history.replaceState(null, '', originalUrl);
    });

    await test('RouteController redirige home y raíz al fallback sin dejar aliases en el historial', async () => {
      const originalUrl = `${window.location.pathname}${window.location.search}${window.location.hash}`;
      const visited = [];
      const router = new RouteController({
        onNavigate: async (page) => visited.push(page),
      });

      window.history.replaceState(null, '', '#/home');
      await router.start('entity:persons');
      assertEquals(visited.at(-1), 'entity:persons', 'Home debe abrir la primera entidad');
      assertEquals(window.location.hash, '#/entity/persons', 'Home debe reemplazarse por la ruta real');

      const rootNavigation = new Promise((resolve) => {
        window.addEventListener('hashchange', resolve, { once: true });
      });
      window.location.hash = '#/';
      await rootNavigation;
      assertEquals(visited.at(-1), 'entity:persons', 'La raíz debe abrir la primera entidad');
      assertEquals(window.location.hash, '#/entity/persons', 'La raíz debe reemplazarse por la ruta real');

      router.stop();
      window.history.replaceState(null, '', originalUrl);
    });

    await test('RouteMapController resuelve y genera el mapa hash completo', async () => {
      const routes = [
        ['profile', '#/profile'],
        ['users', '#/users'],
        [userDetailPage('user-7'), '#/users/user-7'],
        [entityPage('persons'), '#/entity/persons'],
        [entityCreatePage('persons'), '#/entity/persons/new'],
        [entityRecordPage('persons', 'record-9'), '#/entity/persons/record-9'],
        [entityTabPage('persons', 'record-9', 'comments'), '#/entity/persons/record-9/comments'],
        ['plugins', '#/plugins'],
        [pluginConfigPage('comments'), '#/plugins/comments'],
        ['login', '#/login'],
      ];

      routes.forEach(([page, hash]) => {
        assertEquals(hashFromPage(page), hash, `Hash incorrecto para ${page}`);
        assertEquals(getPageFromHash(hash, 'home'), page, `Página incorrecta para ${hash}`);
      });

      assertEquals(hashFromPage('home'), '#/home', 'El alias home debe conservar hash navegable');
      assertEquals(getPageFromHash('#/home', 'entity:persons'), 'entity:persons',
        'Home debe resolver al fallback de entidad');

      const pluginPage = getPageFromHash('#/plugins/comments', 'home');
      assertTrue(PluginRouteController.isPluginConfigPage(pluginPage),
        'El controlador debe reconocer el token generado por el mapa');
      assertEquals(PluginRouteController.getPluginSlugFromPage(pluginPage), 'comments',
        'El controlador debe conservar el slug del plugin');
      assertEquals(pluginConfigPage('comments'), 'plugins:comments',
        'El token de configuración de plugin debe seguir la convención namespace:param, igual que users:id');

      assertEquals(getPageFromHash('#/', 'entity:persons'), 'entity:persons',
        'La raíz debe resolver al fallback de entidad');
      assertEquals(getPageFromHash('#/plugins/comments/config', 'home'), 'home',
        'La antigua ruta de configuración de plugins debe quedar fuera del mapa');
      assertEquals(getPageFromHash('#/entity/persons/record-9/comments?panel=activity', 'home'),
        'entity-tab:persons:record-9:comments', 'La query no debe destruir el contexto de tab');
      assertEquals(getPageFromHash('#/entity/persons/record-9/comments/extra', 'home'),
        'home', 'Las rutas fuera del mapa deben usar fallback');
    });

    await test('HASH_ROUTE_MAP es la única fuente de las plantillas de hash, sin entradas decorativas', async () => {
      assertEquals(Object.keys(HASH_ROUTE_MAP).sort(), [
        'entityCreate', 'entityDetail', 'entityList', 'entityTab',
        'login', 'home', 'plugins', 'pluginConfig', 'profile', 'userDetail', 'users',
      ].sort(), 'El mapa no debe acumular plantillas de resultado nunca implementadas (resultEmpty/resultError/resultForbidden)');

      assertEquals(hashFromPage(userDetailPage('u-9')), fillTemplate(HASH_ROUTE_MAP.userDetail, 'u-9'),
        'El hash de detalle de usuario debe derivar del propio HASH_ROUTE_MAP.userDetail');
      assertEquals(hashFromPage(pluginConfigPage('comments')), fillTemplate(HASH_ROUTE_MAP.pluginConfig, 'comments'),
        'El hash de configuración de plugin debe derivar del propio HASH_ROUTE_MAP.pluginConfig');
      assertEquals(hashFromPage(entityRecordPage('persons', 'record-9')), fillTemplate(HASH_ROUTE_MAP.entityDetail, 'persons', 'record-9'),
        'El hash de detalle de entidad debe derivar del propio HASH_ROUTE_MAP.entityDetail');
      assertEquals(hashFromPage(entityTabPage('persons', 'record-9', 'comments')), fillTemplate(HASH_ROUTE_MAP.entityTab, 'persons', 'record-9', 'comments'),
        'El hash de tab de entidad debe derivar del propio HASH_ROUTE_MAP.entityTab');
    });

    await test('parseEntityRecordPage es la única implementación del parser entity-record:', async () => {
      assertEquals(parseEntityRecordPage('entity-record:persons:record-9'), { slug: 'persons', recordId: 'record-9' },
        'Debe extraer slug y recordId del token');
      assertTrue(parseEntityRecordPage('entity-record:persons') === null, 'Debe rechazar tokens sin recordId');
      assertTrue(parseEntityRecordPage('entity-record::record-9') === null, 'Debe rechazar slug vacío');
      assertTrue(parseEntityRecordPage('entity-record:persons:') === null, 'Debe rechazar recordId vacío');
      assertTrue(parseEntityRecordPage('entity:persons') === null, 'Debe rechazar tokens de otro tipo de página');
      assertEquals(parseEntityRecordPage('entity-record:persons:record-9:extra'),
        { slug: 'persons', recordId: 'record-9:extra' },
        'El recordId conserva cualquier resto tras el segundo separador');
    });

    await test('ShellLayout construye el árbol exacto y expone sus targets', async () => {
      const host = document.createElement('div');
      document.body.append(host);
      const shell = ShellLayout.create(host).build();

      assertEquals(shell.getTarget('shell-menu-nav').parentElement.dataset.role, 'shell-menu', 'Nav fuera de shell-menu');
      assertEquals(shell.getTarget('shell-menu-config').parentElement.dataset.role, 'shell-menu', 'Config fuera de shell-menu');
      assertEquals(shell.getTarget('shell-menu-config-theme').parentElement.dataset.role, 'shell-menu-config', 'Theme fuera de config');
      assertEquals(shell.getTarget('shell-menu-config-user').parentElement.dataset.role, 'shell-menu-config', 'Usuario fuera de config');
      assertEquals(shell.getTarget('shell-floating-ui').parentElement.dataset.role, 'shell', 'Panel flotante fuera de shell');
      assertEquals(shell.getTarget('shell-main').parentElement.dataset.role, 'shell-body', 'Main fuera de body');
      assertEquals(shell.getTarget('shell-header').parentElement.dataset.role, 'shell-main', 'Header fuera de main');
      assertEquals(shell.getTarget('shell-header').childElementCount, 0, 'ShellLayout no debe inyectar componentes de página');
      assertTrue(shell.getTarget('page-header-title') === null, 'ShellLayout no debe registrar targets de PageLayout');
      assertTrue(shell.showPlaceholder === undefined, 'ShellLayout no debe renderizar contenido de página');
      assertEquals(shell.getTarget('shell-main-notifications').parentElement.dataset.role, 'shell-main', 'Notificaciones fuera de main');
      assertEquals(shell.getTarget('shell-main-content').parentElement.dataset.role, 'shell-main', 'Contenido fuera de main');
      assertEquals(shell.getTarget('shell-main-actions').parentElement.dataset.role, 'shell-main', 'Acciones fuera de main');
      const mainClassNames = shell.getTarget('shell-main').classList;
      assertTrue(mainClassNames.contains('pb-4'), 'shell-main debe separarse con pb-4');
      assertTrue(![...mainClassNames].some((className) => /^m[trblxy]?-/.test(className)), 'shell-main no debe usar márgenes');
      const marginTargets = ['shell-header', 'shell-main-notifications', 'shell-main-content', 'shell-main-actions'];
      marginTargets.forEach((targetName) => {
        const classNames = shell.getTarget(targetName).classList;
        if (targetName !== 'shell-main-notifications') {
          assertTrue(classNames.contains('pb-4'), `${targetName} debe separarse con pb-4`);
        }
        assertTrue(classNames.contains('mx-5'), `${targetName} debe usar mx-5`);
      });
      assertTrue(shell.getTarget('shell-footer').classList.contains('mx-5'), 'shell-footer debe usar mx-5');
      const notifications = shell.getTarget('shell-main-notifications');
      assertTrue(notifications.classList.contains('flex'), 'Notificaciones debe usar flex');
      assertTrue(notifications.classList.contains('flex-col'), 'Notificaciones debe apilarse en columna');
      assertTrue(!notifications.classList.contains('grid'), 'Notificaciones no debe usar grid');
      assertTrue(notifications.hidden, 'Notificaciones vacías deben permanecer ocultas');
      assertTrue(!notifications.classList.contains('pb-4'), 'Notificaciones ocultas no deben reservar padding');
      shell.appendZone('shell-main-notifications', document.createElement('div'));
      assertTrue(!notifications.hidden, 'Notificaciones con contenido deben mostrarse');
      assertTrue(notifications.classList.contains('pb-4'), 'Notificaciones visibles deben separarse con pb-4');
      shell.clearZone('shell-main-notifications');
      assertTrue(notifications.hidden, 'Notificaciones deben ocultarse al vaciarse');
      assertTrue(!notifications.classList.contains('pb-4'), 'Notificaciones vacías deben retirar el padding');
      assertEquals(shell.getTarget('shell-footer').parentElement.dataset.role, 'shell', 'Footer fuera de shell');

      host.remove();
    });

    await test('ShellLayout aplica preferencias globales de UI al shell activo', async () => {
      const host = document.createElement('div');
      document.body.append(host);
      const shell = ShellLayout.create(host).build();

      shell.applyUiPreferences({
        contentWidth: 'fluid',
        menuStyle: 'light',
        fixedHeader: false,
        navigationMode: 'side',
        sideMenuType: 'compact',
        fixedSidebar: true,
        regions: {
          header: false,
          footer: false,
          menu: true,
          menuHeader: false,
        },
      });

      assertEquals(shell.getTarget('shell').dataset.uiContentWidth, 'fluid', 'El shell debe reflejar el width activo');
      assertEquals(shell.getTarget('shell').dataset.uiNavigationMode, 'side', 'El shell debe reflejar el modo de navegación');
      assertEquals(shell.getTarget('shell-menu-nav').parentElement.dataset.role, 'shell-menu', 'La navegación superior debe permanecer en shell-menu');
      assertTrue(!shell.getTarget('shell-menu-nav').hidden, 'En modo side la navegación debe mostrarse en shell-menu');
      assertTrue(shell.getTarget('shell-menu-config').hidden, 'Menu header false debe ocultar la zona de configuración');
      assertTrue(shell.getTarget('shell-header').hidden, 'Header false debe ocultar la cabecera de página');
      assertTrue(shell.getTarget('shell-footer').hidden, 'Footer false debe ocultar el pie');

      host.remove();
    });

    await test('ShellLayout en modo side transforma shell-menu en panel lateral', async () => {
      const host = document.createElement('div');
      document.body.append(host);
      const shell = ShellLayout.create(host).build();

      shell.applyUiPreferences({
        contentWidth: 'boxed',
        menuStyle: 'brand',
        fixedHeader: true,
        navigationMode: 'side',
        sideMenuType: 'default',
        fixedSidebar: true,
        regions: {
          header: true,
          footer: true,
          menu: true,
          menuHeader: true,
        },
      });

      assertTrue(!shell.getTarget('shell-menu').hidden, 'En modo side el shell-menu debe permanecer visible');
      assertEquals(shell.getTarget('shell-menu-config').parentElement.dataset.role, 'shell-menu', 'La configuración debe quedarse dentro de shell-menu');

      host.remove();
    });

    await test('ShellLayout en modo mixed añade una barra superior de ancho completo', async () => {
      const host = document.createElement('div');
      document.body.append(host);
      const shell = ShellLayout.create(host).build();

      shell.applyUiPreferences({
        contentWidth: 'boxed',
        menuStyle: 'brand',
        fixedHeader: true,
        navigationMode: 'mixed',
        sideMenuType: 'default',
        fixedSidebar: true,
        regions: {
          header: true,
          footer: true,
          menu: true,
          menuHeader: true,
        },
      });

      const mixedNavbar = new Navbar(shell.getTarget('shell-mixed-bar-nav'), {
        entities: [{ slug: 'persons', label: 'Clientes' }],
        currentPage: 'entity:persons',
        userContainer: shell.getTarget('shell-mixed-bar-config-user'),
        linksContainer: shell.getTarget('shell-menu-nav'),
        linksOrientation: 'side',
        showUserMenu: false,
      });
      mixedNavbar.setActive('entity:persons');
      assertTrue(shell.getTarget('shell-mixed-bar').querySelector('[data-role="navbar-brand"]') !== null, 'La barra mixed debe renderizar la marca');

      assertEquals(shell.getTarget('shell').dataset.uiNavigationMode, 'mixed', 'El shell debe conservar el modo mixed');
      assertTrue(!shell.getTarget('shell-mixed-bar').hidden, 'En modo mixed debe existir la barra superior');
      assertEquals(shell.getTarget('shell-mixed-bar').parentElement.dataset.role, 'shell', 'La barra mixed debe colgar directamente de shell');
      assertEquals(shell.getTarget('shell-mixed-bar-config').parentElement.dataset.role, 'shell-mixed-bar', 'La configuración debe moverse a la barra superior');
      assertEquals(shell.getTarget('shell-mixed-bar-config-theme').parentElement.dataset.role, 'shell-mixed-bar-config', 'Theme debe vivir en el config superior');
      assertEquals(shell.getTarget('shell-mixed-bar-config-user').parentElement.dataset.role, 'shell-mixed-bar-config', 'Usuario debe vivir en el config superior');
      const mixedBrand = shell.getTarget('shell-mixed-bar').querySelector('[data-role="navbar-brand"]');
      assertTrue(mixedBrand !== null, 'La barra mixed debe renderizar la marca');
      assertTrue(!shell.getTarget('shell-menu').hidden, 'En modo mixed el shell-menu lateral debe permanecer visible');
      assertEquals(shell.getTarget('shell-menu').parentElement.dataset.role, 'shell-body', 'El menú lateral debe permanecer en shell-body');
      assertTrue(!shell.getTarget('shell-menu-nav').hidden, 'En modo mixed la navegación lateral debe mostrarse');

      host.remove();
    });

    await test('PageLayout sincroniza setters fluent directamente con ShellLayout', async () => {
      const host = document.createElement('div');
      document.body.append(host);
      const shell = ShellLayout.create(host).build();
      const toolbarButton = component.create('button', { label: 'Crear', variant: 'primary' });
      const actionButton = component.create('button', { label: 'Guardar', variant: 'primary' });

      const page = PageLayout.create(shell.getTarget('shell-main-content'), { shell })
        .setTemplate('detail')
        .setTitle('Detalle de usuario')
        .setDescription('Edita los datos del usuario.')
        .setBreadcrumbs([{ label: 'Usuarios', href: '#/users' }, { label: 'Detalle', active: true }])
        .setHeaderToolbar(toolbarButton)
        .addMainAction(actionButton)
        .setFooter('Ficha de usuario');

      assertEquals(page.getTarget('page-header-title').textContent, 'Detalle de usuario', 'Título no sincronizado');
      assertEquals(shell.getTarget('shell-main-content').dataset.template, 'detail', 'Template no sincronizado');
      const breadcrumb = page.getTarget('page-header-breadcrumbs').querySelector('[data-role="page-breadcrumbs"]');
      assertTrue(breadcrumb?.querySelector('a[href="#/users"]') !== null, 'Breadcrumb no sincronizado');
      assertTrue(typeof breadcrumb?.resolveConfig === 'function', 'PageLayout debe usar BreadcrumbComponent');
      assertTrue(typeof toolbarButton.variantClassName === 'function', 'PageLayout debe usar ButtonComponent');
      assertTrue(page.getTarget('page-header-toolbar').contains(toolbarButton), 'Toolbar no sincronizado');
      assertTrue(shell.getTarget('shell-main-actions').contains(actionButton), 'Acción no sincronizada');

      const notification = component.create('alert', { type: 'success', message: 'Guardado' });
      page.setNotification(notification);
      assertTrue(notification.classList.contains('rounded-md'), 'La notificación debe conservar rounded-md');
      assertTrue(!notification.classList.contains('border'), 'La notificación debe nacer sin borde');
      assertTrue(!notification.classList.contains('border-0'), 'PageLayout no debe corregir estilos del componente');

      const headerBottom = page.getTarget('page-header-bottom');
      assertTrue(headerBottom.hidden, 'Header bottom vacío debe permanecer oculto');
      const tabs = document.createElement('nav');
      page.setHeaderBottom(tabs);
      assertTrue(!headerBottom.hidden, 'Header bottom con contenido debe mostrarse');
      page.setHeaderBottom(null);
      assertTrue(headerBottom.hidden, 'Header bottom debe ocultarse de nuevo al vaciarlo');

      assertTrue(page.addHeaderAction === undefined, 'No debe existir el alias addHeaderAction');
      assertTrue(page.addHeaderToolbar === undefined, 'No debe existir un mutador aditivo de toolbar');
      assertTrue(page.addHeaderBottom === undefined, 'No debe existir el wrapper addHeaderBottom');
      assertTrue(page.setShellZone === undefined, 'No debe existir el bypass genérico setShellZone');
      assertTrue(page.syncHeaderBottom === undefined, 'La sincronización interna no debe ser pública');
      assertTrue(page.setContainer === undefined, 'El contenedor debe fijarse en construcción');
      assertTrue(page.setShell === undefined, 'La shell debe fijarse en construcción');
      assertTrue(page.addContent === undefined, 'No debe existir un segundo mutador de contenido');
      assertTrue(page.getPage === undefined, 'No debe exponerse un getter redundante de página');
      assertTrue(PageLayout.createActionButton === undefined, 'PageLayout no debe construir botones');
      assertTrue(PageLayout.createFeedbackBanner === undefined, 'PageLayout no debe construir alertas');
      assertTrue(PageLayout.findFeedback === undefined, 'PageLayout no debe buscar alertas de páginas');

      let receivedTarget = null;
      page.setContent((target) => {
        receivedTarget = target;
        const content = document.createElement('p');
        content.textContent = 'Contenido';
        target.append(content);
      });

      assertTrue(receivedTarget === shell.getTarget('shell-main-content'), 'El builder no recibió el target real de la shell');
      assertEquals(shell.getTarget('shell-main-content').textContent, 'Contenido', 'Contenido no sincronizado inmediatamente');
      page.build();
      assertEquals(shell.getTarget('shell-main-content').textContent, 'Contenido', 'Contenido no montado');
      host.remove();
    });

    await test('PageLayout aplica la plantilla Login sin crear un shell paralelo', async () => {
      const host = document.createElement('div');
      document.body.append(host);
      const layout = PageLayout.create(host)
        .setTemplate('login')
        .setFooter('Acceso seguro')
        .build();

      const loginShell = host.querySelector(':scope > [data-role="login-shell"]');
      const content = layout.getContentTarget();
      assertTrue(loginShell !== null, 'Falta la plantilla login');
      assertTrue(content === loginShell.querySelector(':scope > [data-role="login-content"]'), 'Contenido fuera de Login');
      assertEquals(loginShell.querySelector('[data-role="login-footer"]')?.textContent, 'Acceso seguro', 'Footer incorrecto');
      assertTrue(loginShell.querySelector('[data-role="shell-menu"]') === null, 'Login no debe incluir navegación autenticada');

      host.remove();
    });

    await test('ListLayout construye contenido y tabla dentro de shell-main-content', async () => {
      const host = document.createElement('div');
      document.body.append(host);
      const shell = ShellLayout.create(host).build();
      const layout = ListLayout.create(shell.getTarget('shell-main-content'), { shell })
        .setTitle('Usuarios')
        .build();
      const tableHost = layout.createTableHost();

      layout.createTable(
        [{ name: 'Ana' }],
        { fields: [{ name: 'name', label: 'Nombre' }] },
        { container: tableHost, showPagination: false },
      );

      assertTrue(shell.getTarget('shell-main-content').querySelector('[data-role="list-section"]') !== null, 'Falta list-section');
      assertTrue(tableHost.querySelector('table') !== null, 'Falta tabla real');
      host.remove();
    });

    await test('FormLayout monta panel y acciones en las zonas correctas', async () => {
      const host = document.createElement('div');
      document.body.append(host);
      const shell = ShellLayout.create(host).build();
      const layout = FormLayout.create(shell.getTarget('shell-main-content'), {
        shell,
      })
        .setTitle('Configuración de usuario')
        .build();
      const saveButton = document.createElement('button');
      saveButton.textContent = 'Guardar';
      const fluentResult = layout.addAction(saveButton);

      assertTrue(layout.getPanel().dataset.role === 'form-panel', 'FormLayout debe exponer el rol canónico form-panel');
      assertTrue(layout.getPanel().parentElement === shell.getTarget('shell-main-content'), 'Panel debe ser hijo directo del contenido');
      assertTrue(shell.getTarget('shell-main-content').querySelector('[data-role="form-content-host"]') === null, 'No debe existir form-content-host');
      assertTrue(shell.getTarget('shell-main-actions').contains(saveButton), 'Acción fuera de shell-main-actions');
      assertTrue(fluentResult === layout, 'FormLayout.addAction debe ser fluent');
      assertTrue(layout.getActionsTarget === undefined, 'FormLayout no debe exponer el target de acciones');
      host.remove();
    });

    finishTestRunner('output');
  </script>
</body>
</html>
