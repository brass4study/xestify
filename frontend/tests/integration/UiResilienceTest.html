<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>UiResilienceTest - Xestify Frontend</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
<h2>UiResilienceTest</h2>
<pre id="output"></pre>

<script type="module">
  import { AppState } from '../../js/models/StateModel.js';
  import { UiResilienceService } from '../../js/services/UiResilienceService.js';
  import { ApiError } from '../../js/models/ApiClientModel.js';
  import { Modal } from '../../js/views/modules/Modal.js';
  import { setLocale, t } from '../../js/models/I18nModel.js';
  import { AppController } from '../../js/controllers/AppController.js';
  import { ShellLayout } from '../../js/views/layout/ShellLayout.js';
  import { initTestRunner, separator, test, assertEquals, assertTrue, finishTestRunner } from '../js/helpers.js';

  initTestRunner('output');

  separator();

  await test('AppState tracks global notification and navigation state', async () => {
    AppState.clearNotification();
    AppState.setNavigationState({ page: 'entity', entity: 'clients' });

    UiResilienceService.showNotification({
      type: 'info',
      title: 'Procesando',
      message: 'Cargando datos',
    });

    const notification = AppState.getNotification();
    assertTrue(notification !== null, 'Debe existir una notificación global');
    assertEquals(notification.message, 'Cargando datos');
    assertEquals(AppState.getNavigationState().entity, 'clients');

    AppState.clearNotification();
    assertTrue(AppState.getNotification() === null, 'La notificación debe limpiarse');
  });

  await test('UiResilienceService normalizes errors into friendly messages', async () => {
    const message = UiResilienceService.handleError(new Error('boom'), 'Fallback local');
    assertEquals(message, 'Fallback local', 'Debe usar el fallbackMessage recibido, no una clave fija del diccionario');

    const networkError = new ApiError(0, 'Network error — server unreachable');
    const networkMessage = UiResilienceService.handleError(networkError, 'Fallback local');
    assertEquals(networkMessage, 'No se pudo completar la solicitud. Revise la conexión e intente nuevamente.');

    const nonNetworkApiError = UiResilienceService.handleError(new ApiError(500, 'Server error'), 'Fallback local');
    assertEquals(nonNetworkApiError, 'Fallback local', 'Un ApiError sin code 0 no debe tratarse como error de red');
  });

  await test('i18n helper resolves translations and locale fallbacks', async () => {
    setLocale('es');
    assertEquals(t('ui.loading'), 'Cargando…');
    assertEquals(t('ui.unknown', 'Texto alternativo'), 'Texto alternativo');
  });

  await test('UiResilienceService confirm() attaches listeners to content set before the single modal.show() call', async () => {
    const container = document.createElement('div');
    document.body.appendChild(container);

    const originalShow = Modal.prototype.show;
    let showCalls = 0;
    Modal.prototype.show = function patchedShow(...args) {
      showCalls += 1;
      return originalShow.apply(this, args);
    };

    const confirmation = UiResilienceService.confirm({
      container,
      title: 'Confirmar acción',
      message: '¿Desea continuar?',
    });

    const overlay = container.querySelector('[data-role="modal-overlay"]');
    overlay.querySelector('[data-action="cancel-modal"]').click();
    await confirmation;

    Modal.prototype.show = originalShow;
    assertEquals(showCalls, 1, 'confirm() no debe recalcular el foco de retorno con una segunda llamada a modal.show()');

    container.remove();
  });

  await test('UiResilienceService confirm flow resolves user choice', async () => {
    const container = document.createElement('div');
    document.body.appendChild(container);

    const confirmation = UiResilienceService.confirm({
      container,
      title: 'Confirmar acción',
      message: '¿Desea continuar?',
      confirmLabel: 'Sí',
      cancelLabel: 'No',
    });

    const overlay = container.querySelector('[data-role="modal-overlay"]');
    assertTrue(overlay !== null, 'Debe renderizar el modal de confirmación');

    const cancelButton = overlay.querySelector('[data-action="cancel-modal"]');
    assertTrue(cancelButton instanceof HTMLElement, 'Debe existir el botón de cancelación');
    cancelButton.click();

    assertEquals(await confirmation, false, 'Debe resolver con false al cancelar');
    container.remove();
  });

  await test('UiResilienceService renders a shared view state and pending button state', async () => {
    const host = document.createElement('div');
    document.body.appendChild(host);

    UiResilienceService.setViewState(host, {
      type: 'loading',
      title: 'Cargando datos',
      message: 'Estamos preparando la vista',
    });

    const viewState = host.querySelector('[data-role="view-state"]');
    assertTrue(viewState instanceof HTMLElement, 'Debe crear un estado compartido en el contenedor');
    assertEquals(viewState.dataset.state, 'loading');
    assertTrue(viewState.textContent.includes('Cargando datos'));

    const button = document.createElement('button');
    button.textContent = 'Guardar';
    host.appendChild(button);

    UiResilienceService.setButtonPending(button, 'Guardando...');
    assertTrue(button.disabled, 'El botón debe quedar deshabilitado mientras se procesa');
    assertEquals(button.getAttribute('aria-busy'), 'true');

    UiResilienceService.clearViewState(host);
    assertTrue(host.querySelector('[data-role="view-state"]') === null, 'Debe poder limpiar el estado compartido');

    host.remove();
  });

  await test('Confirm modal exposes accessible labeling and focus management', async () => {
    const container = document.createElement('div');
    document.body.appendChild(container);

    const confirmation = UiResilienceService.confirm({
      container,
      title: 'Confirmar acción',
      message: '¿Desea continuar?',
      confirmLabel: 'Sí',
      cancelLabel: 'No',
    });

    const overlay = container.querySelector('[data-role="modal-overlay"]');
    assertTrue(overlay instanceof HTMLElement, 'Debe existir el overlay del modal');
    assertTrue(typeof overlay.getAttribute('aria-labelledby') === 'string' && overlay.getAttribute('aria-labelledby') !== '', 'Debe etiquetar el modal con aria-labelledby');

    const confirmButton = overlay.querySelector('[data-action="confirm-modal"]');
    assertTrue(confirmButton instanceof HTMLButtonElement, 'Debe existir el botón principal del modal');
    assertTrue(document.activeElement === confirmButton, 'El foco debe moverse al botón principal al abrir el modal');

    confirmButton.click();
    assertEquals(await confirmation, true, 'Debe resolver con true al confirmar');
    container.remove();
  });

  await test('Confirm modal restores focus to the trigger after dismissal', async () => {
    const container = document.createElement('div');
    const trigger = document.createElement('button');
    trigger.textContent = 'Abrir';
    document.body.appendChild(container);
    document.body.appendChild(trigger);
    trigger.focus();

    const confirmation = UiResilienceService.confirm({
      container,
      title: 'Confirmar acción',
      message: '¿Desea continuar?',
      confirmLabel: 'Sí',
      cancelLabel: 'No',
    });

    const overlay = container.querySelector('[data-role="modal-overlay"]');
    assertTrue(overlay instanceof HTMLElement, 'Debe existir el overlay del modal');

    const cancelButton = overlay.querySelector('[data-action="cancel-modal"]');
    assertTrue(cancelButton instanceof HTMLButtonElement, 'Debe existir el botón de cancelación');
    cancelButton.click();

    assertEquals(await confirmation, false, 'Debe resolver con false al cancelar');
    assertTrue(document.activeElement === trigger, 'El foco debe volver al disparador después de cerrar el modal');

    container.remove();
    trigger.remove();
  });

  await test('AppController placeholder rendering does not crash when component factory is unavailable', async () => {
    const container = document.createElement('div');
    document.body.appendChild(container);

    const controller = new AppController(container);
    controller.showPlaceholder('Vista de prueba');

    const placeholder = container.querySelector('[data-role="placeholder"]');
    assertTrue(placeholder instanceof HTMLElement, 'Debe crear un placeholder renderizable');
    assertEquals(placeholder.textContent, 'Vista de prueba');

    container.remove();
  });

  await test('hydrateUiPreferences() aplica la misma política de 401 que loadEntitiesForNav/loadCurrentUserProfile', async () => {
    const host = document.createElement('div');
    document.body.appendChild(host);

    const controller = new AppController(host);
    controller.dashboardApi = {
      get: async () => {
        throw new ApiError(401, 'Unauthorized');
      },
    };

    const result = await controller.hydrateUiPreferences();

    assertTrue(result === null, 'Debe señalar al llamador que el 401 forzó logout, como loadEntitiesForNav');
    assertTrue(host.querySelector('[data-role="login-shell"]') !== null,
      'Un 401 en hydrateUiPreferences ya no debe engullirse en silencio: debe forzar clearAuth() + renderLogin()');

    host.remove();
  });

  await test('AppController routes page notifications to shell-main-notifications without using the global overlay', async () => {
    const host = document.createElement('div');
    document.body.appendChild(host);

    const controller = new AppController(host);
    controller.shellLayout = ShellLayout.create(host);
    controller.shellLayout.build();

    UiResilienceService.showNotification({
      type: 'success',
      title: 'Plugin actualizado',
      message: 'El cambio se aplicó correctamente',
    });

    await new Promise((resolve) => window.requestAnimationFrame(() => resolve()));

    const pageNotification = host.querySelector('[data-role="page-notification"]');
    assertTrue(pageNotification instanceof HTMLElement, 'Debe mostrar la notificación de acción en shell-main-notifications');
    assertTrue(pageNotification.textContent.includes('Plugin actualizado'));
    assertTrue(host.querySelector('[data-role="global-notification"]') === null, 'Las notificaciones de acción no deben usar la capa global');

    host.remove();
  });

  await test('AppController renders a global notification through the single AppState.subscribeNotification channel', async () => {
    const host = document.createElement('div');
    document.body.appendChild(host);

    const controller = new AppController(host);
    controller.shellLayout = ShellLayout.create(host);
    controller.shellLayout.build();

    let renderCalls = 0;
    const originalRender = controller.renderGlobalNotifications.bind(controller);
    controller.renderGlobalNotifications = () => {
      renderCalls += 1;
      return originalRender();
    };

    UiResilienceService.showNotification({
      type: 'warning',
      title: 'Activación',
      message: 'El plugin se ha activado',
      global: true,
    });

    await new Promise((resolve) => window.requestAnimationFrame(() => resolve()));
    await new Promise((resolve) => window.requestAnimationFrame(() => resolve()));

    assertEquals(renderCalls, 1, 'Una sola notificación debe disparar un único render: ya no existen el CustomEvent duplicado en window/document ni su listener redundante en AppController');

    const notification = host.querySelector('[data-role="global-notification"]');
    assertTrue(notification instanceof HTMLElement, 'Debe pintar la notificación global');
    assertTrue(notification.textContent.includes('Activación'));

    host.remove();
  });

  await test('xestify:notification-changed ya no es un canal soportado (vestigio eliminado)', async () => {
    const host = document.createElement('div');
    document.body.appendChild(host);

    const controller = new AppController(host);
    controller.shellLayout = ShellLayout.create(host);
    controller.shellLayout.build();

    window.dispatchEvent(new CustomEvent('xestify:notification-changed', {
      detail: {
        type: 'warning',
        title: 'Evento externo',
        message: 'No debería pintarse',
        global: true,
      },
    }));

    await new Promise((resolve) => window.requestAnimationFrame(() => resolve()));

    assertTrue(host.querySelector('[data-role="global-notification"]') === null,
      'AppController ya no debe escuchar xestify:notification-changed en window/document');

    host.remove();
  });

  await test('AppController renders floating notifications as a modal toast in shell-floating-ui', async () => {
    const host = document.createElement('div');
    document.body.appendChild(host);

    const controller = new AppController(host);
    controller.shellLayout = ShellLayout.create(host);
    controller.shellLayout.build();

    UiResilienceService.showNotification({
      type: 'error',
      title: 'Error global',
      message: 'Se requiere atención',
    });
    controller.renderGlobalNotifications();

    const notification = host.querySelector('[data-role="global-notification"]');
    assertTrue(notification instanceof HTMLElement, 'Debe renderizar la notificación global en la capa flotante');
    const closeButton = notification.querySelector('[data-action="dismiss-global-notification"]');
    assertTrue(closeButton instanceof HTMLButtonElement, 'Debe exponer un botón de cierre en la notificación flotante');

    host.remove();
  });

  await test('AppController renders a blocking backdrop and closes the notification with a fade-out animation', async () => {
    const host = document.createElement('div');
    document.body.appendChild(host);

    const controller = new AppController(host);
    controller.shellLayout = ShellLayout.create(host);
    controller.shellLayout.build();

    UiResilienceService.showNotification({
      type: 'error',
      title: 'Actualización completada',
      message: 'El plugin quedó actualizado',
    });

    await new Promise((resolve) => window.requestAnimationFrame(() => resolve()));

    const backdrop = host.querySelector('[data-role="modal-backdrop"]');
    assertTrue(backdrop instanceof HTMLElement, 'Debe renderizar un backdrop que bloquee la interacción');
    assertTrue(backdrop.classList.contains('modal-backdrop'), 'Debe reutilizar la clase compartida del backdrop');

    const notification = host.querySelector('[data-role="global-notification"]');
    const closeButton = notification?.querySelector('[data-action="dismiss-global-notification"]');
    assertTrue(closeButton instanceof HTMLButtonElement, 'Debe exponer un botón de cierre en la notificación flotante');

    closeButton.click();
    await new Promise((resolve) => setTimeout(resolve, 260));

    assertTrue(host.querySelector('[data-role="global-notification"]') === null, 'La notificación debe cerrarse con la animación de salida');

    host.remove();
  });

  await test('AppController creates a fallback floating host when the shell target is unavailable', async () => {
    const host = document.createElement('div');
    document.body.appendChild(host);

    const controller = new AppController(host);
    controller.shellLayout = null;

    UiResilienceService.showNotification({
      type: 'error',
      title: 'Plugin actualizado',
      message: 'El cambio se aplicó correctamente',
    });

    await new Promise((resolve) => window.requestAnimationFrame(() => resolve()));

    const notification = host.querySelector('[data-role="global-notification"]');
    assertTrue(notification instanceof HTMLElement, 'Debe crear un host flotante de respaldo y pintar la notificación');

    host.remove();
  });

  await test('Theme preferences persist in localStorage and normalize correctly', async () => {
    const before = window.localStorage.getItem('xestify_ui_preferences');
    AppState.setUiPreferences({ pageStyle: 'dark', themeColor: 'red', navigationMode: 'side' });

    const stored = window.localStorage.getItem('xestify_ui_preferences');
    assertTrue(typeof stored === 'string' && stored.includes('dark'), 'Debe persistir el estilo de página');
    assertTrue(typeof stored === 'string' && stored.includes('red'), 'Debe persistir el color del tema');

    const preferences = AppState.getUiPreferences();
    assertEquals(preferences.pageStyle, 'dark');
    assertEquals(preferences.themeColor, 'red');
    assertEquals(preferences.navigationMode, 'side');

    if (before === null) {
      window.localStorage.removeItem('xestify_ui_preferences');
    } else {
      window.localStorage.setItem('xestify_ui_preferences', before);
    }
  });

  separator();
  finishTestRunner('output');
</script>
</body>
</html>
