<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>DynamicFormTest - Xestify Frontend</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
<h2>DynamicFormTest</h2>
<div id="sandbox" style="display:none"></div>
<pre id="output"></pre>

<script type="module">
  import { DynamicForm } from '../../js/views/modules/DynamicForm.js';
  import { initTestRunner, log, assertEquals, assertTrue } from '../js/helpers.js';

  initTestRunner('output');

  const sandbox = document.getElementById('sandbox');

  // Local counters for custom test() function below
  let passed = 0;
  let failed = 0;

  function setInputValue(selector, value) {
    const input = sandbox.querySelector(selector);
    if (!input) {
      throw new Error(`Input not found: ${selector}`);
    }
    input.value = value;
  }

  function setCheckbox(selector, checked) {
    const input = sandbox.querySelector(selector);
    if (!input) {
      throw new Error(`Checkbox not found: ${selector}`);
    }
    input.checked = Boolean(checked);
  }

  function buildFullSchema() {
    return {
      fields: [
        { name: 'title', label: 'Title', type: 'string', required: true, minLength: 3 },
        { name: 'description', label: 'Description', type: 'text', required: true },
        { name: 'amount', label: 'Amount', type: 'number', min: 1, max: 100 },
        { name: 'email', label: 'Email', type: 'email', required: true },
        { name: 'due_date', label: 'Due Date', type: 'date', required: true },
        { name: 'start_time', label: 'Start time', type: 'time' },
        { name: 'status', label: 'Status', type: 'select', options: ['draft', 'published'], required: true },
        { name: 'is_active', label: 'Active', type: 'boolean' }
      ]
    };
  }

  async function test(name, fn) {
    try {
      sandbox.innerHTML = '<div id="form-container"></div>';
      await fn();
      log(`  ✅ ${name}`);
      passed++;
    } catch (e) {
      log(`  ❌ ${name}`);
      log(`     ${e.message}`);
      failed++;
    }
  }

  function separator() {
    log('────────────────────────────────────────────────────────────────────────');
  }

  function finishLocalSummary() {
    separator();
    const cls = failed === 0 ? 'pass' : 'fail';
    log(`Resultado: ${passed} passed, ${failed} failed`);

    document.getElementById('output').innerHTML = document.getElementById('output').textContent
      .replaceAll('✅', '<span class="pass">✅</span>')
      .replaceAll('❌', '<span class="fail">❌</span>')
      .replace(/Resultado:.*/, (m) => `<span class="${cls}">${m}</span>`);
  }

  separator();

  await test('render() creates controls for all supported field types', async () => {
    const form = new DynamicForm(buildFullSchema(), '#form-container');
    form.render();

    assertTrue(sandbox.querySelector('input[name="title"][type="text"]') !== null, 'string input missing');
    assertTrue(sandbox.querySelector('textarea[name="description"]') !== null, 'text textarea missing');
    const amountInput = sandbox.querySelector('input[name="amount"][type="number"]');
    assertTrue(amountInput !== null, 'number input missing native type="number"');
    assertEquals(amountInput.getAttribute('min'), '1', 'number input should carry min from schema');
    assertEquals(amountInput.getAttribute('max'), '100', 'number input should carry max from schema');
    assertTrue(sandbox.querySelector('input[name="email"][type="email"]') !== null, 'email input missing');
    assertTrue(sandbox.querySelector('input[name="due_date"][type="date"]') !== null, 'date input missing');
    assertTrue(sandbox.querySelector('input[name="start_time"][type="time"]') !== null, 'time input missing native type="time"');
    assertTrue(sandbox.querySelector('select[name="status"]') !== null, 'select input missing');
    const booleanSwitch = sandbox.querySelector('[data-role="input-switch"] input[name="is_active"]');
    assertTrue(booleanSwitch !== null, 'boolean switch missing');
    assertTrue(booleanSwitch.getAttribute('role') === 'switch', 'boolean control should expose switch semantics');
  });

  await test('getData() returns normalized values by type', async () => {
    const form = new DynamicForm(buildFullSchema(), '#form-container');
    form.render();

    setInputValue('input[name="title"]', 'Invoice A');
    setInputValue('textarea[name="description"]', 'Large product description');
    setInputValue('input[name="amount"]', '25');
    setInputValue('input[name="email"]', 'admin@xestify.local');
    setInputValue('input[name="due_date"]', '2026-05-01');
    setInputValue('input[name="start_time"]', '09:30');
    setInputValue('select[name="status"]', 'published');
    setCheckbox('input[name="is_active"]', true);

    const data = form.getData();
    assertEquals(data.title, 'Invoice A');
    assertEquals(data.description, 'Large product description');
    assertEquals(data.amount, 25);
    assertEquals(data.email, 'admin@xestify.local');
    assertEquals(data.due_date, '2026-05-01');
    assertEquals(data.start_time, '09:30');
    assertEquals(data.status, 'published');
    assertEquals(data.is_active, true);
  });

  await test('validate() passes for valid input', async () => {
    const form = new DynamicForm(buildFullSchema(), '#form-container');
    form.render();

    setInputValue('input[name="title"]', 'Invoice A');
    setInputValue('textarea[name="description"]', 'Valid description');
    setInputValue('input[name="amount"]', '50');
    setInputValue('input[name="email"]', 'admin@xestify.local');
    setInputValue('input[name="due_date"]', '2026-05-10');
    setInputValue('select[name="status"]', 'draft');

    const result = form.validate();
    assertTrue(result.isValid === true, 'validation should pass');
    assertEquals(result.errors, {});
  });

  await test('validate() reports required errors', async () => {
    const form = new DynamicForm(buildFullSchema(), '#form-container');
    form.render();

    const result = form.validate();
    assertTrue(result.isValid === false, 'validation should fail');
    assertTrue(Array.isArray(result.errors.title), 'title errors should exist');
    assertTrue(Array.isArray(result.errors.email), 'email errors should exist');
    assertTrue(result.errors.status === undefined, 'status should default to the first available option');
  });

  await test('validate() reports type and range errors', async () => {
    const form = new DynamicForm(buildFullSchema(), '#form-container');
    form.render();

    setInputValue('input[name="title"]', 'ab');
    setInputValue('input[name="amount"]', '150');
    setInputValue('input[name="email"]', 'invalid-email');
    setInputValue('input[name="due_date"]', '05/10/2026');
    setInputValue('select[name="status"]', 'not-allowed');

    const result = form.validate();

    assertTrue(result.isValid === false, 'validation should fail');
    assertTrue(result.errors.title.length > 0, 'title minLength error expected');
    assertTrue(result.errors.amount.length > 0, 'amount range error expected');
    assertTrue(result.errors.email.length > 0, 'email format error expected');
    assertTrue(result.errors.due_date.length > 0, 'date format error expected');
    assertTrue(result.errors.status.length > 0, 'select options error expected');
  });

  await test('constructor accepts schema.fields as object map', async () => {
    const schema = {
      fields: {
        title: { type: 'string', required: true },
        count: { type: 'number' }
      }
    };

    const form = new DynamicForm(schema, '#form-container');
    form.render();

    assertTrue(sandbox.querySelector('input[name="title"]') !== null, 'title should render');
    assertTrue(sandbox.querySelector('input[name="count"]') !== null, 'count should render');
  });

  await test('constructor renders custom_fields using key as input name', async () => {
    const schema = {
      fields: {
        name: { type: 'string', required: true }
      },
      custom_fields: [
        { key: 'phone', label: 'Phone', type: 'string' },
        { key: 'creation_stamp', label: 'Created', type: 'timestamp', default: 'now' },
        { key: 'is_active', label: 'Active', type: 'boolean', default: true }
      ]
    };

    const form = new DynamicForm(schema, '#form-container');
    form.render();

    assertTrue(sandbox.querySelector('input[name="name"]') !== null, 'name should render');
    assertTrue(sandbox.querySelector('input[name="phone"]') !== null, 'phone custom field should render');
    assertTrue(
      sandbox.querySelector('input[name="creation_stamp"][type="text"]') !== null,
      'timestamp custom field should render as text'
    );
    assertTrue(
      sandbox.querySelector('[data-role="input-switch"] input[name="is_active"]') !== null,
      'boolean custom field should render as switch'
    );

    const data = form.getData();
    assertEquals(data.creation_stamp, 'now');
    assertEquals(data.is_active, true);
  });

  function buildRelationSchema(relationOverrides = {}) {
    return {
      fields: [
        { name: 'total', label: 'Total', type: 'number', required: true }
      ],
      relations: [
        {
          key: 'id_person',
          type: 'belongs_to',
          target_entity: 'persons',
          target_field: 'id',
          label: 'Cliente',
          required: true,
          ...relationOverrides
        }
      ]
    };
  }

  await test('normalizeFields() folds schema.relations into a disabled select with a loading placeholder', async () => {
    const form = new DynamicForm(buildRelationSchema(), '#form-container');
    form.render();

    const select = sandbox.querySelector('select[name="id_person"]');
    assertTrue(select !== null, 'relation select should render');
    assertTrue(select.disabled === true, 'relation select should start disabled until options are resolved');
    assertEquals(select.options[0].textContent, 'Cargando…');
  });

  await test('a relations[] entry with type other than belongs_to (or missing type) is ignored', async () => {
    const schema = {
      fields: [],
      relations: [
        { key: 'many_orders', type: 'has_many', target_entity: 'orders', label: 'Pedidos' },
        { key: 'no_type', target_entity: 'orders', label: 'Sin tipo' },
        { key: 'id_person', type: 'belongs_to', target_entity: 'persons', label: 'Cliente', required: false }
      ]
    };

    const form = new DynamicForm(schema, '#form-container');
    form.render();

    assertTrue(sandbox.querySelector('[name="many_orders"]') === null, 'has_many relation must not render a field');
    assertTrue(sandbox.querySelector('[name="no_type"]') === null, 'a relation without type must not render a field');
    assertTrue(sandbox.querySelector('select[name="id_person"]') !== null, 'the belongs_to relation must still render');
  });

  await test('setFieldOptions() hydrates a relation select and lets validate() accept the selected value', async () => {
    const form = new DynamicForm(buildRelationSchema(), '#form-container');
    form.render();
    setInputValue('input[name="total"]', '10');

    const applied = form.setFieldOptions('id_person', [{ value: 'p1', label: 'Persona 1' }]);
    assertTrue(applied === true, 'setFieldOptions() should report success for a known field');

    const select = sandbox.querySelector('select[name="id_person"]');
    assertTrue(select.disabled === false, 'select should be reactivated once options arrive');
    select.value = 'p1';

    const result = form.validate();
    assertTrue(result.isValid === true, `validation should pass once field.options is kept in sync: ${JSON.stringify(result.errors)}`);
  });

  await test('an optional relation accepts an empty selection once hydrated with a placeholder', async () => {
    const form = new DynamicForm(buildRelationSchema({ required: false }), '#form-container');
    form.render();
    setInputValue('input[name="total"]', '10');

    form.setFieldOptions('id_person', [{ value: 'p1', label: 'Persona 1' }], { placeholder: 'Sin asignar' });

    const result = form.validate();
    assertTrue(result.isValid === true, 'an unset optional relation must still validate');
    assertEquals(form.getData().id_person, '');
  });

  await test('getData() returns the selected value for a hydrated relation field', async () => {
    const form = new DynamicForm(buildRelationSchema(), '#form-container');
    form.render();

    form.setFieldOptions('id_person', [{ value: 'p1', label: 'Persona 1' }, { value: 'p2', label: 'Persona 2' }]);
    sandbox.querySelector('select[name="id_person"]').value = 'p2';

    assertEquals(form.getData().id_person, 'p2');
  });

  finishLocalSummary();
</script>
</body>
</html>
