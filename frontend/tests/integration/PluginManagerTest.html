<div id="sandbox" style="display:none"></div>

  const out = document.getElementById('output');

  let failed = 0;

  // Mock Api
  class MockApi {
    constructor(responses = {}) {
      this.responses = responses;
      this.calls = [];
    }

    async get(url) {
      this.calls.push({ method: 'GET', url });
      if (url === '/plugins/updates' && this.responses[url] === undefined) {
        return { ok: true, data: { updates: [] } };
      }
      return this.responses[url] ?? { ok: false, error: { message: 'Not mocked' } };
    }

    async post(url, body) {
      this.calls.push({ method: 'POST', url, body });
      const key = url.split('?')[0];
      return this.responses[key] ?? { ok: false, error: { message: 'Not mocked' } };
    }

    async put(url, body) {
      this.calls.push({ method: 'PUT', url, body });
      const key = url.split('?')[0];
      return this.responses[key] ?? { ok: false, error: { message: 'Not mocked' } };
    }

    async delete(url) {
      this.calls.push({ method: 'DELETE', url });
      const key = url.split('?')[0];
      return this.responses[key] ?? { ok: false, error: { message: 'Not mocked' } };
    }
  }

  function log(msg) {
    out.textContent += msg + '\n';
  }

  function separator() {
    log('────────────────────────────────────────────────────────────────────────');
  }

  async function test(name, fn) {
    try {
      await fn();
      log(`✅ ${name}`);
      passed++;
    } catch (error) {
      log(`❌ ${name}: ${error.message}`);
      failed++;
    }
  }

  function assertEquals(actual, expected, msg) {
    if (actual !== expected) {
      throw new Error(`${msg} (expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)})`);
    }
  }

  function assertTrue(value, msg) {
    if (!value) throw new Error(msg);
  }

  function makeSandbox() {
    const div = document.createElement('div');
    document.getElementById('sandbox').appendChild(div);
    return div;
  }

  function makeShellSandbox() {
    const host = makeSandbox();
    const shell = ShellLayout.create(host).build();
    return { host, shell, content: shell.getTarget('shell-main-content') };
  }

  log('────────────────────────────────────────────────────────────────────────\n');

  await test('renders plugins split into Entidades and Extensiones sections', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'persons', name: 'Persons', plugin_type: 'entity', version: '1.0.0', status: 'active' },
            { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'inactive' },
          ],
        },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const entitySection = container.querySelector('[data-role="plugin-section-entities"]');
    const extensionSection = container.querySelector('[data-role="plugin-section-extensions"]');
    assertTrue(entitySection !== null, 'Entities section should render');
    assertTrue(extensionSection !== null, 'Extensions section should render');

    const entityRows = entitySection.querySelectorAll('[data-role="plugin-row"]');
    const extensionRows = extensionSection.querySelectorAll('[data-role="plugin-row"]');
    assertEquals(entityRows.length, 1, 'Entities section should render 1 row');
    assertEquals(extensionRows.length, 1, 'Extensions section should render 1 row');
    assertEquals(entityRows[0].dataset.slug, 'persons', 'Entity row slug');
    assertEquals(extensionRows[0].dataset.slug, 'comments', 'Extension row slug');

    const entityHeaders = [...entitySection.querySelectorAll('thead th')].map((header) => header.textContent.trim());
    assertEquals(entityHeaders.join('|'), 'Nombre|Versión|Estado|Acciones', 'Las columnas deben estar en español, sin columna Tipo');
  });

  await test('re-renders after activation', async () => {
    const container = makeSandbox();
    // PluginManager re-fetches /plugins after a status change (same pattern
    // as update/rollback) instead of splicing the PUT response into local
    // state, so this mock tracks status server-side rather than returning a
    // fixed GET response — it must reflect the PUT that happened before it.
    let status = 'inactive';
    const api = {
      calls: [],
      async get(url) {
        this.calls.push({ method: 'GET', url });
        if (url === '/plugins') {
          return {
            ok: true,
            data: { plugins: [{ slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status }] },
          };
        }
        if (url === '/plugins/updates') {
          return { ok: true, data: { updates: [] } };
        }
        return { ok: false, error: { message: 'Not mocked' } };
      },
      async put(url, body) {
        this.calls.push({ method: 'PUT', url, body });
        if (url === '/plugins/comments/status') {
          status = body.status;
          return { ok: true, data: { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status } };
        }
        return { ok: false, error: { message: 'Not mocked' } };
      },
      async post() {
        return { ok: false, error: { message: 'Not mocked' } };
      },
    };

    const manager = new PluginManager(container, api);
    await manager.init();

    const btn = container.querySelector('[data-role="plugin-action"]');
    btn.click();

    await new Promise((resolve) => setTimeout(resolve, 100));

    const statusBadge = container.querySelector('[data-role="plugin-status-badge"]');
    assertTrue(statusBadge.textContent.includes('Activo'), 'La insignia de estado debe indicar Activo');
  });

    const inactiveRow = container.querySelector('tr[data-slug="comments"]');

    assertTrue(activeRow.querySelector('[data-action="delete"]') === null, 'Active plugin should not show delete action');
    assertTrue(inactiveRow.querySelector('[data-action="delete"]') !== null, 'Inactive plugin should show delete action');
  });

  await test('asks confirmation before delete and calls endpoint on confirm', async () => {
    const { shell, content } = makeShellSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'inactive' },
          ],
        },
      },
      '/plugins/comments': {
        ok: true,
        data: { deleted: true, slug: 'comments' },
      },
    });

    const manager = new PluginManager(content, api, { shellLayout: shell });
    await manager.init();

    const deleteBtn = content.querySelector('[data-action="delete"]');
    deleteBtn.click();

    const confirmBtn = content.querySelector('[data-action="confirm-modal"]');
    assertTrue(confirmBtn !== null, 'Confirm button should exist in delete modal');
    confirmBtn.click();
    await new Promise((resolve) => setTimeout(resolve, 50));

    assertTrue(api.calls.some((c) => c.method === 'DELETE' && c.url === '/plugins/comments'), 'Delete endpoint should be called after confirm');
  });

  await test('does not call delete endpoint when deletion is cancelled', async () => {
    const { shell, content } = makeShellSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'inactive' },

    assertTrue(cancelBtn !== null, 'Cancel button should exist in delete modal');
    cancelBtn.click();
    await new Promise((resolve) => setTimeout(resolve, 50));

    assertTrue(!api.calls.some((c) => c.method === 'DELETE'), 'Delete endpoint should not be called when cancelled');
  });

  await test('disables move-up/move-down at the boundaries of each section independently', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'persons', name: 'Persons', plugin_type: 'entity', version: '1.0.0', status: 'active' },
            { slug: 'orders', name: 'Orders', plugin_type: 'entity', version: '1.0.0', status: 'active' },
            { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'active' },
            { slug: 'notes', name: 'Notes', plugin_type: 'extension', version: '1.0.0', status: 'active' },
          ],
        },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const personsRow = container.querySelector('tr[data-slug="persons"]');
    const ordersRow = container.querySelector('tr[data-slug="orders"]');
    const commentsRow = container.querySelector('tr[data-slug="comments"]');
    const notesRow = container.querySelector('tr[data-slug="notes"]');

    assertTrue(personsRow.querySelector('[data-action="move-up"]').disabled === true, 'First entity move-up should be disabled');
    assertTrue(personsRow.querySelector('[data-action="move-down"]').disabled === false, 'First entity move-down should be enabled');
    assertTrue(ordersRow.querySelector('[data-action="move-up"]').disabled === false, 'Last entity move-up should be enabled');
    assertTrue(ordersRow.querySelector('[data-action="move-down"]').disabled === true, 'Last entity move-down should be disabled');

    assertTrue(commentsRow.querySelector('[data-action="move-up"]').disabled === true, 'First extension move-up should be disabled');
    assertTrue(commentsRow.querySelector('[data-action="move-down"]').disabled === false, 'First extension move-down should be enabled');
    assertTrue(notesRow.querySelector('[data-action="move-up"]').disabled === false, 'Last extension move-up should be enabled');
    assertTrue(notesRow.querySelector('[data-action="move-down"]').disabled === true, 'Last extension move-down should be disabled');
  });

  await test('calls POST /plugins/{slug}/move-down when move down clicked', async () => {

  });

  await test('calls onConfigure callback when configure button is clicked', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'persons', name: 'Persons', plugin_type: 'entity', version: '1.0.0', status: 'active' },
          ],
        },
      },
    });

    let configuredSlug = '';
    const manager = new PluginManager(container, api, {
      onConfigure: (plugin) => {
        configuredSlug = plugin.slug;
      },
    });
    await manager.init();

    const configureBtn = container.querySelector('[data-action="configure"]');
    assertTrue(configureBtn !== null, 'Configure button should exist');
    configureBtn.click();

    assertEquals(configuredSlug, 'persons', 'onConfigure should receive plugin slug');
  });

  await test('buildActionButton defaults to theme color when no explicit tone is passed', () => {
    const button = DynamicTable.buildActionButton({
      label: 'Editar',
      icon: 'fa-pen',
      dataRole: 'record-edit',
      onClick: () => {},

    assertTrue(button.className.includes('text-brand-700'), 'Action button should default to the theme brand color');
    assertTrue(button.className.includes('hover:text-brand-500'), 'Action button should use the theme hover color');
    assertTrue(button.className.includes('focus:ring-brand-200'), 'Action button should keep the theme focus ring');
  });

  await test('buildActionButton preserves explicit tone colors', () => {
    const button = DynamicTable.buildActionButton({
      label: 'Desactivar',

      tone: 'amber',

    assertTrue(button.className.includes('text-amber-700'), 'Action button should preserve the explicit amber tone');
    assertTrue(button.className.includes('hover:text-amber-600'), 'Action button should preserve the explicit amber hover tone');
  });

  // ─────────────────────────────────────────────────────────────────────────

  separator();
  log('────────────────────────────────────────────────────────────────────────');
  const cls = failed === 0 ? 'pass' : 'fail';
  log(`Resultado: ${passed} passed, ${failed} failed`);

  out.innerHTML = out.textContent
    .replaceAll('✅', '<span class="pass">✅</span>')

    .replace(/Resultado:.*/, (m) => `<span class="${cls}">${m}</span>`);
