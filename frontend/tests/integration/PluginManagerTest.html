<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PluginManagerTest - Xestify Frontend</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
<h2>PluginManagerTest</h2>
<div id="sandbox" style="display:none"></div>
<pre id="output"></pre>

<script type="module">
  import { PluginManager } from '../../js/views/pages/PluginManager.js';
  import { ShellLayout } from '../../js/views/layout/ShellLayout.js';
  import { DynamicTable } from '../../js/views/modules/DynamicTable.js';
  import { AppController } from '../../js/controllers/AppController.js';

  const out = document.getElementById('output');
  let passed = 0;
  let failed = 0;

  // Mock Api
  class MockApi {
    constructor(responses = {}) {
      this.responses = responses;
      this.calls = [];
    }

    async get(url) {
      this.calls.push({ method: 'GET', url });
      if (url === '/plugins/updates' && this.responses[url] === undefined) {
        return { ok: true, data: { updates: [] } };
      }
      return this.responses[url] ?? { ok: false, error: { message: 'Not mocked' } };
    }

    async post(url, body) {
      this.calls.push({ method: 'POST', url, body });
      const key = url.split('?')[0];
      return this.responses[key] ?? { ok: false, error: { message: 'Not mocked' } };
    }

    async put(url, body) {
      this.calls.push({ method: 'PUT', url, body });
      const key = url.split('?')[0];
      return this.responses[key] ?? { ok: false, error: { message: 'Not mocked' } };
    }
  }

  function log(msg) {
    out.textContent += msg + '\n';
  }

  function separator() {
    log('────────────────────────────────────────────────────────────────────────');
  }

  async function test(name, fn) {
    try {
      await fn();
      log(`✅ ${name}`);
      passed++;
    } catch (error) {
      log(`❌ ${name}: ${error.message}`);
      failed++;
    }
  }

  function assertEquals(actual, expected, msg) {
    if (actual !== expected) {
      throw new Error(`${msg} (expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)})`);
    }
  }

  function assertTrue(value, msg) {
    if (!value) throw new Error(msg);
  }

  function makeSandbox() {
    const div = document.createElement('div');
    document.getElementById('sandbox').appendChild(div);
    return div;
  }

  function makeShellSandbox() {
    const host = makeSandbox();
    const shell = ShellLayout.create(host).build();
    return { host, shell, content: shell.getTarget('shell-main-content') };
  }

  log('────────────────────────────────────────────────────────────────────────\n');

  await test('renders list of plugins', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'persons', name: 'Persons', plugin_type: 'entity', version: '1.0.0', status: 'active' },
            { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'inactive' },
          ],
        },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const rows = container.querySelectorAll('[data-role="plugin-row"]');
    assertEquals(rows.length, 2, 'Should render 2 rows');
    assertEquals(rows[0].dataset.slug, 'persons', 'First row slug');
    assertEquals(rows[1].dataset.slug, 'comments', 'Second row slug');
    const headers = [...container.querySelectorAll('thead th')].map((header) => header.textContent.trim());
    assertEquals(headers.join('|'), 'Nombre|Tipo|Versión|Estado|Acciones', 'Las columnas deben estar en español');
  });

  await test('renders empty state when no plugins', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: { plugins: [] },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const empty = container.querySelector('[data-role="plugin-empty"]');
    assertTrue(empty !== null, 'Empty state should be displayed');
  });

  await test('shows correct plugin type badges', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'persons', name: 'Persons', plugin_type: 'entity', version: '1.0.0', status: 'active' },
            { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'active' },
          ],
        },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const badges = container.querySelectorAll('[data-role="plugin-type-badge"]');
    assertEquals(badges.length, 2, 'Should have 2 type badges');
    assertTrue(badges[0].textContent.includes('entidad'), 'La primera insignia debe indicar entidad');
    assertTrue(badges[1].textContent.includes('extensión'), 'La segunda insignia debe indicar extensión');
  });

  await test('shows activate button for inactive plugins', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'inactive' },
          ],
        },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const btn = container.querySelector('[data-role="plugin-action"]');
    assertTrue(btn !== null, 'Action button should exist');
    assertEquals(btn.dataset.action, 'activate', 'Button action should be activate');
    assertTrue(btn.textContent.includes('Activar'), 'El botón debe indicar Activar');
  });

  await test('shows deactivate button for active plugins', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'persons', name: 'Persons', plugin_type: 'entity', version: '1.0.0', status: 'active' },
          ],
        },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const btn = container.querySelector('[data-role="plugin-action"]');
    assertEquals(btn.dataset.action, 'deactivate', 'Button action should be deactivate');
    assertTrue(btn.textContent.includes('Desactivar'), 'El botón debe indicar Desactivar');
  });

  await test('calls PUT /plugins/{slug}/status when activate clicked', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'inactive' },
          ],
        },
      },
      '/plugins/comments/status': {
        ok: true,
        data: { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'active' },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const btn = container.querySelector('[data-role="plugin-action"]');
    btn.click();

    // Wait for async operation
    await new Promise((resolve) => setTimeout(resolve, 100));

    assertTrue(api.calls.some((c) => c.method === 'PUT' && c.url.includes('/plugins/comments/status')), 'PUT endpoint should be called');
  });

  await test('action buttons keep working after a DynamicTable internal re-render (density change)', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'inactive' },
          ],
        },
      },
      '/plugins/comments/status': {
        ok: true,
        data: { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'active' },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    // Simulate a density change from the table's own toolbar — DynamicTable
    // rebuilds its DOM internally for this, without PluginManager re-rendering
    // the whole page, so any button bound only right after the first render
    // would go stale here.
    const densityOption = container.querySelector('[data-role="table-density-option"][data-density="compact"]');
    assertTrue(densityOption !== null, 'Density option should exist');
    densityOption.click();

    const btn = container.querySelector('[data-role="plugin-action"]');
    assertTrue(btn !== null, 'Action button should still exist after the density change');
    btn.click();

    await new Promise((resolve) => setTimeout(resolve, 100));

    assertTrue(api.calls.some((c) => c.method === 'PUT' && c.url.includes('/plugins/comments/status')), 'PUT endpoint should still be called after an internal table re-render');
  });

  await test('renders a page notification after plugin activation inside the shell', async () => {
    const host = makeSandbox();
    const shell = ShellLayout.create(host).build();
    const content = shell.getTarget('shell-main-content');
    const controller = new AppController(host);
    controller.shellLayout = shell;

    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'inactive' },
          ],
        },
      },
      '/plugins/comments/status': {
        ok: true,
        data: { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'active' },
      },
    });

    const manager = new PluginManager(content, api, { shellLayout: shell });
    await manager.init();

    const btn = content.querySelector('[data-role="plugin-action"]');
    btn.click();
    await new Promise((resolve) => setTimeout(resolve, 100));

    const notification = shell.getTarget('shell-main-notifications');
    assertTrue(notification instanceof HTMLElement && notification.textContent.includes('Plugin'), 'Debe renderizar la notificación de página al activar el plugin');
  });

  await test('re-renders after activation', async () => {
    const container = makeSandbox();
    // PluginManager re-fetches /plugins after a status change (same pattern
    // as update/rollback) instead of splicing the PUT response into local
    // state, so this mock tracks status server-side rather than returning a
    // fixed GET response — it must reflect the PUT that happened before it.
    let status = 'inactive';
    const api = {
      calls: [],
      async get(url) {
        this.calls.push({ method: 'GET', url });
        if (url === '/plugins') {
          return {
            ok: true,
            data: { plugins: [{ slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status }] },
          };
        }
        if (url === '/plugins/updates') {
          return { ok: true, data: { updates: [] } };
        }
        return { ok: false, error: { message: 'Not mocked' } };
      },
      async put(url, body) {
        this.calls.push({ method: 'PUT', url, body });
        if (url === '/plugins/comments/status') {
          status = body.status;
          return { ok: true, data: { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status } };
        }
        return { ok: false, error: { message: 'Not mocked' } };
      },
      async post() {
        return { ok: false, error: { message: 'Not mocked' } };
      },
    };

    const manager = new PluginManager(container, api);
    await manager.init();

    const btn = container.querySelector('[data-role="plugin-action"]');
    btn.click();

    await new Promise((resolve) => setTimeout(resolve, 100));

    const statusBadge = container.querySelector('[data-role="plugin-status-badge"]');
    assertTrue(statusBadge.textContent.includes('Activo'), 'La insignia de estado debe indicar Activo');
  });

  await test('shows error banner on API failure', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: false,
        error: { message: 'Server error' },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const error = container.querySelector('[data-role="plugin-error"]');
    assertTrue(error !== null, 'Error banner should be displayed');
  });

  await test('shows configure button for active entity and extension plugins', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'persons', name: 'Persons', plugin_type: 'entity', version: '1.0.0', status: 'active' },
            { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'active' },
          ],
        },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const configureButtons = container.querySelectorAll('[data-action="configure"]');
    assertEquals(configureButtons.length, 2, 'Active entity and extension plugins should expose Configure button');
  });

  await test('shows sync button in header', async () => {
    const { shell, content } = makeShellSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: { plugins: [] },
      },
    });

    const manager = new PluginManager(content, api, { shellLayout: shell });
    await manager.init();

    const toolbar = shell.getTarget('shell-header').querySelector('[data-role="page-header-toolbar"]');
    const button = toolbar.querySelector('[data-action="sync"]');
    assertTrue(button !== null, 'Synchronize button should exist');
    assertEquals(shell.getTarget('shell-header').querySelector('[data-role="page-title"]').textContent, 'Gestión de plugins', 'El título debe estar en español');
    assertEquals(shell.getTarget('shell-header').querySelector('[data-role="page-header-description"]').textContent, 'Sincroniza, activa y configura plugins del sistema.', 'La descripción debe estar en español');

    assertTrue(toolbar !== null, 'Synchronize button should live in the page header toolbar');
  });

  await test('calls POST /plugins/sync when synchronize is clicked', async () => {
    const { shell, content } = makeShellSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'persons', name: 'Persons', plugin_type: 'entity', version: '1.0.0', status: 'active', can_rollback: false },
          ],
        },
      },
      '/plugins/updates': {
        ok: true,
        data: { updates: [] },
      },
      '/plugins/sync': {
        ok: true,
        data: {
          summary: { discovered: 1, registered: 0, unchanged: 1, outdated: 0, errors: 0 },
          plugins: {},
        },
      },
    });

    const manager = new PluginManager(content, api, { shellLayout: shell });
    await manager.init();

    const syncButton = shell.getTarget('shell-header').querySelector('[data-role="page-header-toolbar"] [data-action="sync"]');
    syncButton.click();
    await new Promise((resolve) => setTimeout(resolve, 50));

    assertTrue(api.calls.some((c) => c.method === 'POST' && c.url === '/plugins/sync'), 'Sync endpoint should be called');
    const syncButtons = shell.getTarget('shell-header').querySelectorAll('[data-role="page-header-toolbar"] [data-action="sync"]');
    assertEquals(syncButtons.length, 1, 'Synchronize should keep a single toolbar button after rerender');
  });

  await test('shows update badge and update action when update is available', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'persons', name: 'Persons', plugin_type: 'entity', version: '1.0.0', status: 'active', can_rollback: false },
          ],
        },
      },
      '/plugins/updates': {
        ok: true,
        data: {
          updates: [
            { slug: 'persons', installed_version: '1.0.0', available_version: '2.0.0', plugin_type: 'entity', name: 'Persons' },
          ],
        },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const badge = container.querySelector('[data-role="plugin-update-badge"]');
    const updateBtn = container.querySelector('[data-action="update"]');
    assertTrue(badge !== null, 'Update badge should be visible');
    assertTrue(updateBtn !== null, 'Update button should be visible');
  });

  await test('shows configure before update and rollback actions', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'persons', name: 'Persons', plugin_type: 'entity', version: '1.0.0', status: 'active', can_rollback: true },
          ],
        },
      },
      '/plugins/updates': {
        ok: true,
        data: {
          updates: [
            { slug: 'persons', installed_version: '1.0.0', available_version: '2.0.0', plugin_type: 'entity', name: 'Persons' },
          ],
        },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const actions = [...container.querySelectorAll('[data-role="plugin-row"] [data-role="plugin-action"]')]
      .map((button) => button.dataset.action);
    assertEquals(actions.join(','), 'deactivate,configure,update,rollback', 'Optional plugin actions should follow Configure');
  });

  await test('shows rollback button only when can_rollback is true', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'persons', name: 'Persons', plugin_type: 'entity', version: '2.0.0', status: 'active', can_rollback: true },
            { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'active', can_rollback: false },
          ],
        },
      },
      '/plugins/updates': {
        ok: true,
        data: { updates: [] },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const rows = [...container.querySelectorAll('[data-role="plugin-row"]')];
    const rollbackForPersons = rows[0].querySelector('[data-action="rollback"]');
    const rollbackForComments = rows[1].querySelector('[data-action="rollback"]');
    assertTrue(rollbackForPersons !== null, 'Rollback should exist for persons');
    assertTrue(rollbackForComments === null, 'Rollback should not exist for comments');
  });

  await test('asks confirmation before update and calls endpoint on confirm', async () => {
    const { shell, content } = makeShellSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'persons', name: 'Persons', plugin_type: 'entity', version: '1.0.0', status: 'active', can_rollback: false },
          ],
        },
      },
      '/plugins/updates': {
        ok: true,
        data: {
          updates: [
            { slug: 'persons', installed_version: '1.0.0', available_version: '2.0.0', plugin_type: 'entity', name: 'Persons' },
          ],
        },
      },
      '/plugins/persons/update': {
        ok: true,
        data: {
          plugin: { slug: 'persons', version: '2.0.0', status: 'active' },
          update: { from_version: '1.0.0', to_version: '2.0.0', schema_changed: false, diff: {} },
        },
      },
    });

    const manager = new PluginManager(content, api, { shellLayout: shell });
    await manager.init();

    const updateBtn = content.querySelector('[data-action="update"]');
    updateBtn.click();

    const confirmBtn = content.querySelector('[data-action="confirm-modal"]');
    assertTrue(confirmBtn !== null, 'Confirm button should exist in modal');
    confirmBtn.click();
    await new Promise((resolve) => setTimeout(resolve, 50));

    assertTrue(api.calls.some((c) => c.method === 'POST' && c.url === '/plugins/persons/update'), 'Update endpoint should be called after confirm');
  });

  await test('asks confirmation before rollback and calls endpoint on confirm', async () => {
    const { shell, content } = makeShellSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'persons', name: 'Persons', plugin_type: 'entity', version: '2.0.0', status: 'active', can_rollback: true },
          ],
        },
      },
      '/plugins/updates': {
        ok: true,
        data: { updates: [] },
      },
      '/plugins/persons/rollback': {
        ok: true,
        data: {
          plugin: { slug: 'persons', version: '1.0.0', status: 'active' },
          rollback: { from_version: '2.0.0', to_version: '1.0.0', snapshot_id: 's1' },
        },
      },
    });

    const manager = new PluginManager(content, api, { shellLayout: shell });
    await manager.init();

    const rollbackBtn = content.querySelector('[data-action="rollback"]');
    rollbackBtn.click();

    const confirmBtn = content.querySelector('[data-action="confirm-modal"]');
    assertTrue(confirmBtn !== null, 'Confirm button should exist in rollback modal');
    confirmBtn.click();
    await new Promise((resolve) => setTimeout(resolve, 50));

    assertTrue(api.calls.some((c) => c.method === 'POST' && c.url === '/plugins/persons/rollback'), 'Rollback endpoint should be called after confirm');
  });

  await test('calls onConfigure callback when configure button is clicked', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'persons', name: 'Persons', plugin_type: 'entity', version: '1.0.0', status: 'active' },
          ],
        },
      },
    });

    let configuredSlug = '';
    const manager = new PluginManager(container, api, {
      onConfigure: (plugin) => {
        configuredSlug = plugin.slug;
      },
    });
    await manager.init();

    const configureBtn = container.querySelector('[data-action="configure"]');
    assertTrue(configureBtn !== null, 'Configure button should exist');
    configureBtn.click();

    assertEquals(configuredSlug, 'persons', 'onConfigure should receive plugin slug');
  });

  await test('buildActionButton defaults to theme color when no explicit tone is passed', () => {
    const button = DynamicTable.buildActionButton({
      label: 'Editar',
      icon: 'fa-pen',
      dataRole: 'record-edit',
      onClick: () => {},
    });

    assertTrue(button.className.includes('text-brand-700'), 'Action button should default to the theme brand color');
    assertTrue(button.className.includes('hover:text-brand-500'), 'Action button should use the theme hover color');
    assertTrue(button.className.includes('focus:ring-brand-200'), 'Action button should keep the theme focus ring');
  });

  await test('buildActionButton preserves explicit tone colors', () => {
    const button = DynamicTable.buildActionButton({
      label: 'Desactivar',
      icon: 'fa-power-off',
      tone: 'amber',
      dataRole: 'plugin-action',
      onClick: () => {},
    });

    assertTrue(button.className.includes('text-amber-700'), 'Action button should preserve the explicit amber tone');
    assertTrue(button.className.includes('hover:text-amber-600'), 'Action button should preserve the explicit amber hover tone');
  });

  // ─────────────────────────────────────────────────────────────────────────
  // Summary
  // ─────────────────────────────────────────────────────────────────────────

  separator();
  log('────────────────────────────────────────────────────────────────────────');
  const cls = failed === 0 ? 'pass' : 'fail';
  log(`Resultado: ${passed} passed, ${failed} failed`);

  out.innerHTML = out.textContent
    .replaceAll('✅', '<span class="pass">✅</span>')
    .replaceAll('❌', '<span class="fail">❌</span>')
    .replace(/Resultado:.*/, (m) => `<span class="${cls}">${m}</span>`);
</script>
</body>
</html>
