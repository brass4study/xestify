<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>NavbarTest - Xestify Frontend</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
<h2>NavbarTest</h2>
<div id="sandbox" style="display:none"></div>
<pre id="output"></pre>

<script type="module">
  import { Navbar } from '../../js/views/modules/Navbar.js';
  import { UserMenu } from '../../js/views/modules/UserMenu.js';

  let passed = 0;
  let failed = 0;
  const out = document.getElementById('output');

  function log(line) {
    out.textContent += line + '\n';
  }

  function assertTrue(value, msg = 'assertTrue failed') {
    if (!value) {
      throw new Error(msg);
    }
  }

  function assertEquals(a, b, msg) {
    if (a !== b) {
      throw new Error(msg ?? `Expected "${String(b)}" but got "${String(a)}"`);
    }
  }

  function it(name, fn) {
    const container = document.createElement('div');
    document.getElementById('sandbox').appendChild(container);
    try {
      fn(container);
      log(`✅ ${name}`);
      passed++;
    } catch (err) {
      log(`❌ ${name}: ${err.message}`);
      failed++;
    }
    container.remove();
  }

  function separator() {
    log('────────────────────────────────────────────────────────────────────────');
  }

  function finishTestRunner() {
    const cls = failed === 0 ? 'pass' : 'fail';
    log(`Resultado: ${passed} passed, ${failed} failed`);

    out.innerHTML = out.textContent
      .replaceAll('✅', '<span class="pass">✅</span>')
      .replaceAll('❌', '<span class="fail">❌</span>')
      .replace(/Resultado:.*/, (m) => `<span class="${cls}">${m}</span>`);
  }

  const ENTITIES = [
    { slug: 'person', label: 'Clientes' },
    { slug: 'product', label: 'Productos' },
  ];
  const AVATAR_DATA_URI = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';

  function createNavbar(host, options = {}) {
    const navigation = document.createElement('div');
    const userConfiguration = document.createElement('div');
    host.append(navigation, userConfiguration);
    return new Navbar(navigation, { ...options, userContainer: userConfiguration });
  }

  it('renders nav element with brand text', (container) => {
      const navbar = createNavbar(container);
    assertTrue(navbar instanceof Navbar, 'Navbar instance should be created');
    const nav = container.querySelector('[data-role="navbar"]');
    assertTrue(nav !== null, 'Expected [data-role="navbar"] element');
    const brand = container.querySelector('[data-role="navbar-brand"]');
    assertTrue(brand !== null, 'Expected [data-role="navbar-brand"]');
    assertTrue(brand.querySelector('.logo') !== null, 'Brand should render the Logo component');
    assertEquals(brand.textContent, 'estify', 'Brand wordmark text should be estify (the X is the chevron mark)');
  });

  it('renders one nav link per entity and Plugins', (container) => {
      const navbar = createNavbar(container, { entities: ENTITIES, canManagePlugins: true });
    assertTrue(navbar instanceof Navbar, 'Navbar instance should be created');
    const links = container.querySelectorAll('[data-role="navbar-link"]');
    assertEquals(links.length, 3, 'Expected 3 nav links');
    const pages = new Set(Array.from(links).map((l) => l.dataset.page));
    assertTrue(pages.has('entity:person'), 'Missing person entity link');
    assertTrue(pages.has('entity:product'), 'Missing product entity link');
    assertTrue(pages.has('plugins'), 'Missing plugins link');
  });

  it('renders avatar initials and user name in the user menu', (container) => {
      const navbar = createNavbar(container, { userEmail: 'ana.garcia@xestify.local', userName: 'Ana García' });
    assertTrue(navbar instanceof Navbar, 'Navbar instance should be created');
    const avatar = container.querySelector('[data-role="user-menu-avatar"]');
    assertTrue(avatar !== null, 'Expected avatar element');
    assertEquals(avatar.textContent, 'AG', 'Expected initials from user name');
    const label = container.querySelector('[data-role="user-menu-label"]');
    assertEquals(label.textContent, 'Ana García', 'Expected displayed user name');
  });

  it('starts hidden and opens on hover', (container) => {
    const userMenu = new UserMenu(container, { email: 'admin@xestify.local', roles: ['admin'] });
    assertTrue(userMenu instanceof UserMenu, 'UserMenu instance should be created');
    const menu = container.querySelector('[data-role="user-menu-items"]');
    assertTrue(menu !== null, 'Expected menu element');
    assertTrue(menu.hidden, 'Expected menu to start hidden');
    container.dispatchEvent(new MouseEvent('mouseenter', { bubbles: true }));
    assertTrue(!menu.hidden, 'Expected menu to open on hover');
  });

  it('renders an avatar image when provided', (container) => {
    const userMenu = new UserMenu(container, { email: 'admin@xestify.local', avatar: AVATAR_DATA_URI });
    assertTrue(userMenu instanceof UserMenu, 'UserMenu instance should be created');
    const img = container.querySelector('[data-role="user-menu-avatar"] img');
    assertTrue(img !== null, 'Expected avatar image element');
    assertEquals(img.getAttribute('src'), AVATAR_DATA_URI, 'Avatar image should be used when available');
  });

  it('shows the user management action for admins', (container) => {
    const userMenu = new UserMenu(container, { email: 'admin@xestify.local', roles: ['admin'] });
    assertTrue(userMenu instanceof UserMenu, 'UserMenu instance should be created');
    const trigger = container.querySelector('[data-role="user-menu-trigger"]');
    trigger.dispatchEvent(new MouseEvent('mouseenter', { bubbles: true }));
    const adminLink = container.querySelector('[data-menu-action="users"]');
    assertTrue(adminLink !== null, 'Expected admin action link');
  });

  it('dispatches profile navigation from the dropdown', (container) => {
    let navigatedTo = null;
    const navbar = createNavbar(container, {
      userEmail: 'ana.garcia@xestify.local',
      userName: 'Ana García',
      onNavigate: (page) => { navigatedTo = page; },
    });
    navbar.setUserEmail('ana.garcia@xestify.local');
    assertTrue(navbar instanceof Navbar, 'Navbar instance should be created');
    const trigger = container.querySelector('[data-role="user-menu-trigger"]');
    trigger.dispatchEvent(new MouseEvent('mouseenter', { bubbles: true }));
    const profileLink = container.querySelector('[data-menu-action="profile"]');
    profileLink.click();
    assertEquals(navigatedTo, 'profile', 'Expected profile navigation trigger');
  });

  separator();
  finishTestRunner();
</script>
</body>
</html>
