<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PluginManagerTest - Xestify Frontend</title>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
<h2>PluginManagerTest</h2>
<div id="sandbox" style="display:none"></div>
<pre id="output"></pre>

<script type="module">
  import { PluginManager } from '../src/js/pages/PluginManager.js';

  const out = document.getElementById('output');
  let passed = 0;
  let failed = 0;

  // Mock Api
  class MockApi {
    constructor(responses = {}) {
      this.responses = responses;
      this.calls = [];
    }

    async get(url) {
      this.calls.push({ method: 'GET', url });
      if (url === '/plugins/updates' && this.responses[url] === undefined) {
        return { ok: true, data: { updates: [] } };
      }
      return this.responses[url] ?? { ok: false, error: { message: 'Not mocked' } };
    }

    async post(url, body) {
      this.calls.push({ method: 'POST', url, body });
      const key = url.split('?')[0];
      return this.responses[key] ?? { ok: false, error: { message: 'Not mocked' } };
    }

    async put(url, body) {
      this.calls.push({ method: 'PUT', url, body });
      const key = url.split('?')[0];
      return this.responses[key] ?? { ok: false, error: { message: 'Not mocked' } };
    }
  }

  function log(msg) {
    out.textContent += msg + '\n';
  }

  function separator() {
    log('────────────────────────────────────────────────────────────────────────');
  }

  async function test(name, fn) {
    try {
      await fn();
      log(`✅ ${name}`);
      passed++;
    } catch (error) {
      log(`❌ ${name}: ${error.message}`);
      failed++;
    }
  }

  function assertEquals(actual, expected, msg) {
    if (actual !== expected) {
      throw new Error(`${msg} (expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)})`);
    }
  }

  function assertTrue(value, msg) {
    if (!value) throw new Error(msg);
  }

  function makeSandbox() {
    const div = document.createElement('div');
    document.getElementById('sandbox').appendChild(div);
    return div;
  }

  log('────────────────────────────────────────────────────────────────────────\n');

  await test('renders list of plugins', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'clients', name: 'Clients', plugin_type: 'entity', version: '1.0.0', status: 'active' },
            { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'inactive' },
          ],
        },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const rows = container.querySelectorAll('[data-role="plugin-row"]');
    assertEquals(rows.length, 2, 'Should render 2 rows');
    assertEquals(rows[0].dataset.slug, 'clients', 'First row slug');
    assertEquals(rows[1].dataset.slug, 'comments', 'Second row slug');
  });

  await test('renders empty state when no plugins', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: { plugins: [] },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const empty = container.querySelector('[data-role="plugin-empty"]');
    assertTrue(empty !== null, 'Empty state should be displayed');
  });

  await test('shows correct plugin type badges', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'clients', name: 'Clients', plugin_type: 'entity', version: '1.0.0', status: 'active' },
            { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'active' },
          ],
        },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const badges = container.querySelectorAll('[data-role="plugin-type-badge"]');
    assertEquals(badges.length, 2, 'Should have 2 type badges');
    assertTrue(badges[0].textContent.includes('entity'), 'First badge is entity');
    assertTrue(badges[1].textContent.includes('extension'), 'Second badge is extension');
  });

  await test('shows activate button for inactive plugins', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'inactive' },
          ],
        },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const btn = container.querySelector('[data-role="plugin-action"]');
    assertTrue(btn !== null, 'Action button should exist');
    assertEquals(btn.dataset.action, 'activate', 'Button action should be activate');
    assertTrue(btn.textContent.includes('Activate'), 'Button text should say Activate');
  });

  await test('shows deactivate button for active plugins', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'clients', name: 'Clients', plugin_type: 'entity', version: '1.0.0', status: 'active' },
          ],
        },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const btn = container.querySelector('[data-role="plugin-action"]');
    assertEquals(btn.dataset.action, 'deactivate', 'Button action should be deactivate');
    assertTrue(btn.textContent.includes('Deactivate'), 'Button text should say Deactivate');
  });

  await test('calls PUT /plugins/{slug}/status when activate clicked', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'inactive' },
          ],
        },
      },
      '/plugins/comments/status': {
        ok: true,
        data: { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'active' },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const btn = container.querySelector('[data-role="plugin-action"]');
    btn.click();

    // Wait for async operation
    await new Promise((resolve) => setTimeout(resolve, 100));

    assertTrue(api.calls.some((c) => c.method === 'PUT' && c.url.includes('/plugins/comments/status')), 'PUT endpoint should be called');
  });

  await test('re-renders after activation', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'inactive' },
          ],
        },
      },
      '/plugins/comments/status': {
        ok: true,
        data: { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'active' },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const btn = container.querySelector('[data-role="plugin-action"]');
    btn.click();

    await new Promise((resolve) => setTimeout(resolve, 100));

    const statusBadge = container.querySelector('[data-role="plugin-status-badge"]');
    assertTrue(statusBadge.textContent.includes('active'), 'Status badge should show active');
  });

  await test('shows error banner on API failure', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: false,
        error: { message: 'Server error' },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const error = container.querySelector('[data-role="plugin-error"]');
    assertTrue(error !== null, 'Error banner should be displayed');
  });

  await test('shows configure button for active entity and extension plugins', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'clients', name: 'Clients', plugin_type: 'entity', version: '1.0.0', status: 'active' },
            { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'active' },
          ],
        },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const configureButtons = container.querySelectorAll('[data-action="configure"]');
    assertEquals(configureButtons.length, 2, 'Active entity and extension plugins should expose Configure button');
  });

  await test('shows sync button in header', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: { plugins: [] },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const button = container.querySelector('[data-action="sync"]');
    assertTrue(button !== null, 'Synchronize button should exist');
  });

  await test('calls POST /plugins/sync when synchronize is clicked', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'clients', name: 'Clients', plugin_type: 'entity', version: '1.0.0', status: 'active', can_rollback: false },
          ],
        },
      },
      '/plugins/updates': {
        ok: true,
        data: { updates: [] },
      },
      '/plugins/sync': {
        ok: true,
        data: {
          summary: { discovered: 1, registered: 0, unchanged: 1, outdated: 0, errors: 0 },
          plugins: {},
        },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const syncButton = container.querySelector('[data-action="sync"]');
    syncButton.click();
    await new Promise((resolve) => setTimeout(resolve, 50));

    assertTrue(api.calls.some((c) => c.method === 'POST' && c.url === '/plugins/sync'), 'Sync endpoint should be called');
  });

  await test('shows update badge and update action when update is available', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'clients', name: 'Clients', plugin_type: 'entity', version: '1.0.0', status: 'active', can_rollback: false },
          ],
        },
      },
      '/plugins/updates': {
        ok: true,
        data: {
          updates: [
            { slug: 'clients', installed_version: '1.0.0', available_version: '2.0.0', plugin_type: 'entity', name: 'Clients' },
          ],
        },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const badge = container.querySelector('[data-role="plugin-update-badge"]');
    const updateBtn = container.querySelector('[data-action="update"]');
    assertTrue(badge !== null, 'Update badge should be visible');
    assertTrue(updateBtn !== null, 'Update button should be visible');
  });

  await test('shows rollback button only when can_rollback is true', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'clients', name: 'Clients', plugin_type: 'entity', version: '2.0.0', status: 'active', can_rollback: true },
            { slug: 'comments', name: 'Comments', plugin_type: 'extension', version: '1.0.0', status: 'active', can_rollback: false },
          ],
        },
      },
      '/plugins/updates': {
        ok: true,
        data: { updates: [] },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const rows = [...container.querySelectorAll('[data-role="plugin-row"]')];
    const rollbackForClients = rows[0].querySelector('[data-action="rollback"]');
    const rollbackForComments = rows[1].querySelector('[data-action="rollback"]');
    assertTrue(rollbackForClients !== null, 'Rollback should exist for clients');
    assertTrue(rollbackForComments === null, 'Rollback should not exist for comments');
  });

  await test('asks confirmation before update and calls endpoint on confirm', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'clients', name: 'Clients', plugin_type: 'entity', version: '1.0.0', status: 'active', can_rollback: false },
          ],
        },
      },
      '/plugins/updates': {
        ok: true,
        data: {
          updates: [
            { slug: 'clients', installed_version: '1.0.0', available_version: '2.0.0', plugin_type: 'entity', name: 'Clients' },
          ],
        },
      },
      '/plugins/clients/update': {
        ok: true,
        data: {
          plugin: { slug: 'clients', version: '2.0.0', status: 'active' },
          update: { from_version: '1.0.0', to_version: '2.0.0', schema_changed: false, diff: {} },
        },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const updateBtn = container.querySelector('[data-action="update"]');
    updateBtn.click();

    const confirmBtn = container.querySelector('[data-action="confirm-modal"]');
    assertTrue(confirmBtn !== null, 'Confirm button should exist in modal');
    confirmBtn.click();
    await new Promise((resolve) => setTimeout(resolve, 50));

    assertTrue(api.calls.some((c) => c.method === 'POST' && c.url === '/plugins/clients/update'), 'Update endpoint should be called after confirm');
  });

  await test('asks confirmation before rollback and calls endpoint on confirm', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'clients', name: 'Clients', plugin_type: 'entity', version: '2.0.0', status: 'active', can_rollback: true },
          ],
        },
      },
      '/plugins/updates': {
        ok: true,
        data: { updates: [] },
      },
      '/plugins/clients/rollback': {
        ok: true,
        data: {
          plugin: { slug: 'clients', version: '1.0.0', status: 'active' },
          rollback: { from_version: '2.0.0', to_version: '1.0.0', snapshot_id: 's1' },
        },
      },
    });

    const manager = new PluginManager(container, api);
    await manager.init();

    const rollbackBtn = container.querySelector('[data-action="rollback"]');
    rollbackBtn.click();

    const confirmBtn = container.querySelector('[data-action="confirm-modal"]');
    assertTrue(confirmBtn !== null, 'Confirm button should exist in rollback modal');
    confirmBtn.click();
    await new Promise((resolve) => setTimeout(resolve, 50));

    assertTrue(api.calls.some((c) => c.method === 'POST' && c.url === '/plugins/clients/rollback'), 'Rollback endpoint should be called after confirm');
  });

  await test('calls onConfigure callback when configure button is clicked', async () => {
    const container = makeSandbox();
    const api = new MockApi({
      '/plugins': {
        ok: true,
        data: {
          plugins: [
            { slug: 'clients', name: 'Clients', plugin_type: 'entity', version: '1.0.0', status: 'active' },
          ],
        },
      },
    });

    let configuredSlug = '';
    const manager = new PluginManager(container, api, {
      onConfigure: (plugin) => {
        configuredSlug = plugin.slug;
      },
    });
    await manager.init();

    const configureBtn = container.querySelector('[data-action="configure"]');
    assertTrue(configureBtn !== null, 'Configure button should exist');
    configureBtn.click();

    assertEquals(configuredSlug, 'clients', 'onConfigure should receive plugin slug');
  });

  // ─────────────────────────────────────────────────────────────────────────
  // Summary
  // ─────────────────────────────────────────────────────────────────────────

  separator();
  log('────────────────────────────────────────────────────────────────────────');
  const cls = failed === 0 ? 'pass' : 'fail';
  log(`Resultado: ${passed} passed, ${failed} failed`);

  out.innerHTML = out.textContent
    .replaceAll('✅', '<span class="pass">✅</span>')
    .replaceAll('❌', '<span class="fail">❌</span>')
    .replace(/Resultado:.*/, (m) => `<span class="${cls}">${m}</span>`);
</script>
</body>
</html>
